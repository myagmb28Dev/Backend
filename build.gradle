plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.google.firebase:firebase-admin:9.4.2'
	implementation 'com.yubico:webauthn-server-core:2.8.1'
	implementation 'org.sejda.imageio:webp-imageio:0.1.6'
	implementation platform('software.amazon.awssdk:bom:2.32.15')
	implementation 'software.amazon.awssdk:s3'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
	implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs '-Xshare:off'
}

// One-off maintenance: hard delete user by email (Postgres)
tasks.register('hardDeleteUserByEmail', JavaExec) {
	group = 'maintenance'
	description = 'Hard-delete a user and all FK references by email (uses DB_* env vars).'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.example.pogun.tools.HardDeleteUserByEmail'

	def email = project.findProperty('targetEmail')
	if (!email) {
		throw new GradleException("Missing -PtargetEmail (e.g. ./gradlew hardDeleteUserByEmail -PtargetEmail=user@example.com)")
	}
	args email.toString()
}

tasks.register('jdbcDeleteUsersByEmail', JavaExec) {
	group = 'maintenance'
	description = 'Hard-delete multiple users by email using JDBC (.env or DB_* env vars).'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.example.pogun.tools.JdbcDeleteUsersByEmail'

	def emails = project.findProperty('targetEmails')
	if (!emails) {
		throw new GradleException("Missing -PtargetEmails (e.g. ./gradlew jdbcDeleteUsersByEmail -PtargetEmails=a@b.com,c@d.com)")
	}
	args emails.toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }
}

tasks.register('firebaseDeleteUserByEmail', JavaExec) {
	group = 'maintenance'
	description = 'Delete a Firebase user by email using service account (FIREBASE_KEY_BASE64 env).'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.example.pogun.tools.FirebaseDeleteUserByEmail'

	def email = project.findProperty('targetEmail')
	if (!email) {
		throw new GradleException("Missing -PtargetEmail (e.g. ./gradlew firebaseDeleteUserByEmail -PtargetEmail=user@example.com)")
	}
	args email.toString()
}

// Ensure Spring Boot creates only the executable bootJar and not the plain jar
bootJar {
	enabled = true
	archiveFileName = 'app.jar'
}

jar {
	enabled = false
}

