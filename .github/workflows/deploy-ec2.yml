name: Deploy To EC2

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

env:
  IMAGE_NAME: pawgun

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew test bootJar --no-daemon --build-cache

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Delete stale Docker Hub tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          auth_token="$(
            curl -fsSL \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
              https://hub.docker.com/v2/users/login/ \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])"
          )"

          next_url="https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${IMAGE_NAME}/tags?page_size=100"
          while [ -n "$next_url" ] && [ "$next_url" != "null" ]; do
            response="$(curl -fsSL -H "Authorization: JWT ${auth_token}" "$next_url")"
            echo "$response" \
              | python3 -c "import json,sys; data=json.load(sys.stdin); [print(item['name']) for item in data.get('results', []) if item.get('name') != 'latest']" \
              | while IFS= read -r tag_name; do
                  [ -z "$tag_name" ] && continue
                  echo "Deleting stale Docker Hub tag: $tag_name"
                  curl -fsSL -X DELETE \
                    -H "Authorization: JWT ${auth_token}" \
                    "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${IMAGE_NAME}/tags/${tag_name}/" \
                    >/dev/null
                done
            next_url="$(echo "$response" | python3 -c "import json,sys; print(json.load(sys.stdin).get('next') or '')")"
          done

      - name: Verify only latest tag remains
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          auth_token="$(
            curl -fsSL \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
              https://hub.docker.com/v2/users/login/ \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])"
          )"

          success=0
          for attempt in {1..12}; do
            tags_json="$(curl -fsSL -H "Authorization: JWT ${auth_token}" \
              "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${IMAGE_NAME}/tags?page_size=100")"

            non_latest_count="$(echo "$tags_json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for t in d.get('results', []) if t.get('name') != 'latest'))")"
            latest_count="$(echo "$tags_json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for t in d.get('results', []) if t.get('name') == 'latest'))")"

            echo "verify attempt ${attempt}/12: latest_count=${latest_count}, non_latest_count=${non_latest_count}"

            if [ "$latest_count" -ge 1 ] && [ "$non_latest_count" -eq 0 ]; then
              success=1
              break
            fi

            sleep 10
          done

          if [ "$success" -ne 1 ]; then
            echo "ERROR: cleanup verification failed. latest-only state not reached in retry window."
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/pawgun_ec2_key <<'EOF'
          ${{ secrets.EC2_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/pawgun_ec2_key

      - name: Upload docker-compose.yml to EC2
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -o NumberOfPasswordPrompts=1 \
            -i ~/.ssh/pawgun_ec2_key \
            -p "${{ secrets.EC2_PORT || 22 }}" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p '${{ secrets.EC2_APP_DIR }}'"

          ssh \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -o NumberOfPasswordPrompts=1 \
            -i ~/.ssh/pawgun_ec2_key \
            -p "${{ secrets.EC2_PORT || 22 }}" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cat > '${{ secrets.EC2_APP_DIR }}/docker-compose.yml'" < docker-compose.yml

      - name: Create .env on EC2 from GitHub secrets and deploy
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -o NumberOfPasswordPrompts=1 \
            -i ~/.ssh/pawgun_ec2_key \
            -p "${{ secrets.EC2_PORT || 22 }}" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" <<EOF
          set -e
          APP_DIR="${{ secrets.EC2_APP_DIR }}"
          mkdir -p "\$APP_DIR"
          cd "\$APP_DIR"

          if ! command -v docker >/dev/null 2>&1; then
            sudo dnf install -y docker
          fi
          sudo systemctl enable --now docker

          if ! sudo docker compose version >/dev/null 2>&1; then
            arch="\$(uname -m)"
            case "\$arch" in
              x86_64) compose_arch="x86_64" ;;
              aarch64) compose_arch="aarch64" ;;
              *) echo "Unsupported architecture for Docker Compose: \$arch"; exit 1 ;;
            esac
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-\$compose_arch" \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            sudo docker compose version
          fi

          # GitHub Actions secrets are rendered into this heredoc and written to EC2 as .env
          cat > .env <<'ENVEOF'
          SPRING_PROFILES_ACTIVE=prod
          PORT=${{ secrets.PORT }}
          APP_IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pawgun:latest
          AI_API_KEY=${{ secrets.AI_API_KEY }}
          APP_ADMIN_WEBAUTHN_ALLOWED_ORIGINS=${{ secrets.APP_ADMIN_WEBAUTHN_ALLOWED_ORIGINS }}
          APP_ADMIN_WEBAUTHN_RP_ID=${{ secrets.APP_ADMIN_WEBAUTHN_RP_ID }}
          APP_ADMIN_WEBAUTHN_RP_NAME=${{ secrets.APP_ADMIN_WEBAUTHN_RP_NAME }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_URL=${{ secrets.DB_URL }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          FIREBASE_KEY_BASE64=${{ secrets.FIREBASE_KEY_BASE64 }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID=${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_AUTH_DOMAIN=${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
          FIREBASE_WEB_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_PROJECT_ID=${{ secrets.FIREBASE_WEB_PROJECT_ID }}
          FIREBASE_WEB_STORAGE_BUCKET=${{ secrets.FIREBASE_WEB_STORAGE_BUCKET }}
          FIREBASE_WEB_VAPID_KEY=${{ secrets.FIREBASE_WEB_VAPID_KEY }}
          GCLOUD_PROJECT=${{ secrets.GCLOUD_PROJECT }}
          KAKAO_JAVASCRIPT_KEY=${{ secrets.KAKAO_JAVASCRIPT_KEY }}
          KAKAO_LOCAL_BASE_URL=${{ secrets.KAKAO_LOCAL_BASE_URL }}
          KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_PORT=${{ secrets.REDIS_PORT }}
          SHELTER_API_SERVICE_KEY=${{ secrets.SHELTER_API_SERVICE_KEY }}
          ENVEOF

          # docker-compose.yml reads .env, then pulls the tagged app image and starts app + redis
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          sudo docker compose pull app
          sudo docker compose up -d --remove-orphans
          sudo docker compose ps

          for attempt in {1..30}; do
            app_status="\$(sudo docker inspect -f '{{.State.Status}}' pogun-backend)"
            app_health="\$(sudo docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' pogun-backend)"

            if [ "\$app_health" = "healthy" ]; then
              echo "Application healthcheck passed."
              break
            fi

            if [ "\$app_status" = "exited" ] || [ "\$app_status" = "dead" ]; then
              sudo docker compose logs --tail=200 app
              exit 1
            fi

            if [ "\$attempt" -eq 30 ]; then
              sudo docker compose logs --tail=200 app
              exit 1
            fi

            echo "Waiting for app healthcheck... status=\$app_status health=\$app_health attempt=\$attempt/30"
            sleep 5
          done

          sudo docker image prune -f
          EOF
