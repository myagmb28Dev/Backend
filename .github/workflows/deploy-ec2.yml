name: Deploy To EC2

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: deploy-ec2-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: pawgun

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image_tag: ${{ steps.image-tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build and test
        run: ./gradlew test bootJar

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: image-tag
        run: |
          short_sha="${GITHUB_SHA::12}"
          echo "image_tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          IMAGE_REF: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.image_tag }}
        run: |
          docker build -t "$IMAGE_REF" .
          docker push "$IMAGE_REF"

      - name: Delete old Docker Hub image tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CURRENT_IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
          KEEP_IMAGE_TAG_COUNT: "2"
        run: |
          set -euo pipefail

          auth_payload="$(jq -nc --arg username "$DOCKERHUB_USERNAME" --arg password "$DOCKERHUB_TOKEN" '{username: $username, password: $password}')"
          hub_token="$(
            curl -fsSL \
              -H "Content-Type: application/json" \
              -d "$auth_payload" \
              "https://hub.docker.com/v2/users/login/" |
              jq -r '.token'
          )"

          page_url="https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${IMAGE_NAME}/tags?page_size=100"
          tag_rows=""
          while [ -n "$page_url" ]; do
            page_json="$(curl -fsSL -H "Authorization: JWT $hub_token" "$page_url")"
            page_rows="$(
              printf '%s' "$page_json" |
                jq -r '.results[] | select(.name | startswith("sha-")) | [.last_updated, .name] | @tsv'
            )"
            tag_rows="${tag_rows}
          ${page_rows}"
            page_url="$(printf '%s' "$page_json" | jq -r '.next // empty')"
          done

          old_tags="$(
            printf '%s\n' "$tag_rows" |
              sed '/^[[:space:]]*$/d' |
              sort -r |
              awk -F '\t' -v keep_count="$KEEP_IMAGE_TAG_COUNT" -v current_tag="$CURRENT_IMAGE_TAG" '
                $2 == current_tag { current_seen = 1 }
                NR > keep_count { print $2 }
                END {
                  if (!current_seen) {
                    print "Current image tag was not returned by Docker Hub tag list: " current_tag > "/dev/stderr"
                  }
                }
              '
          )"

          if [ -z "$old_tags" ]; then
            echo "No old Docker Hub sha-* tags to delete."
            exit 0
          fi

          printf '%s\n' "$old_tags" |
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              if [ "$tag" = "$CURRENT_IMAGE_TAG" ]; then
                echo "Keeping current Docker Hub tag even if ordering is unexpected: $tag"
                continue
              fi
              echo "Deleting old Docker Hub tag: $tag"
              curl -fsSL \
                -X DELETE \
                -H "Authorization: JWT $hub_token" \
                "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${IMAGE_NAME}/tags/${tag}/"
            done

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/pawgun_ec2_key <<'EOF'
          ${{ secrets.EC2_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/pawgun_ec2_key

      - name: Upload docker-compose.yml to EC2
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -o NumberOfPasswordPrompts=1 \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -i ~/.ssh/pawgun_ec2_key \
            -p "${{ secrets.EC2_PORT || 22 }}" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p '${{ secrets.EC2_APP_DIR }}' && cat > '${{ secrets.EC2_APP_DIR }}/docker-compose.yml'" < docker-compose.yml

      - name: Create .env on EC2 from GitHub secrets and deploy
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -o NumberOfPasswordPrompts=1 \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -i ~/.ssh/pawgun_ec2_key \
            -p "${{ secrets.EC2_PORT || 22 }}" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" <<'EOF'
          set -e
          APP_DIR="${{ secrets.EC2_APP_DIR }}"
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"

          if ! command -v docker >/dev/null 2>&1; then
            sudo dnf install -y docker
          fi
          if ! sudo systemctl is-active --quiet docker; then
            sudo systemctl start docker
          fi
          sudo systemctl enable docker >/dev/null 2>&1 || true

          if ! sudo docker compose version >/dev/null 2>&1; then
            arch="$(uname -m)"
            case "$arch" in
              x86_64) compose_arch="x86_64" ;;
              aarch64) compose_arch="aarch64" ;;
              *) echo "Unsupported architecture for Docker Compose: $arch"; exit 1 ;;
            esac
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-$compose_arch" \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            sudo docker compose version
          fi

          # GitHub Actions secrets are rendered into this heredoc and written to EC2 as .env
          cat > .env <<'ENVEOF'
          SPRING_PROFILES_ACTIVE=prod
          PORT=${{ secrets.PORT }}
          APP_IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}
          APP_STARTUP_WARMUP_ENABLED=true
          APP_SCHEMA_SYNC_ENABLED=true
          APP_PRESENCE_RECONCILE_INTERVAL_MS=1500
          APP_NOTIFICATION_INACTIVE_TOKEN_RETENTION_DAYS=30
          APP_NOTIFICATION_INACTIVE_TOKEN_CLEANUP_CRON=0 10 4 * * *
          APP_ADMIN_SESSION_TTL_SECONDS=28800
          APP_ADMIN_BOOTSTRAP_SESSION_TTL_SECONDS=900
          APP_ADMIN_CHALLENGE_TTL_SECONDS=300
          APP_FIREBASE_AUTH_MODE=PRODUCTION
          APP_FIREBASE_AUTH_ALLOW_EMULATOR=false
          APP_FIREBASE_AUTH_EMULATOR_PROJECT_ID=
          JAVA_STARTUP_OPTS=-XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+AlwaysPreTouch -XX:+UseStringDeduplication -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom
          AI_API_KEY=${{ secrets.AI_API_KEY }}
          APPLE_APP_STORE_ENABLED=${{ secrets.APPLE_APP_STORE_ENABLED }}
          APPLE_APP_STORE_KEY_ID=${{ secrets.APPLE_APP_STORE_KEY_ID }}
          APPLE_APP_STORE_ISSUER_ID=${{ secrets.APPLE_APP_STORE_ISSUER_ID }}
          APPLE_APP_STORE_BUNDLE_ID=${{ secrets.APPLE_APP_STORE_BUNDLE_ID }}
          APPLE_APP_STORE_APP_APPLE_ID=${{ secrets.APPLE_APP_STORE_APP_APPLE_ID }}
          APPLE_APP_STORE_PRIVATE_KEY_BASE64=${{ secrets.APPLE_APP_STORE_PRIVATE_KEY_BASE64 }}
          APPLE_APP_STORE_ENVIRONMENT=${{ secrets.APPLE_APP_STORE_ENVIRONMENT }}
          APPLE_APP_STORE_APP_ACCOUNT_TOKEN_REQUIRED=${{ secrets.APPLE_APP_STORE_APP_ACCOUNT_TOKEN_REQUIRED || 'false' }}
          APP_ADMIN_WEBAUTHN_ALLOWED_ORIGINS=${{ secrets.APP_ADMIN_WEBAUTHN_ALLOWED_ORIGINS }}
          APP_ADMIN_WEBAUTHN_ORIGIN_RP_MAP=${{ secrets.APP_ADMIN_WEBAUTHN_ORIGIN_RP_MAP }}
          APP_ADMIN_WEBAUTHN_RP_ID=${{ secrets.APP_ADMIN_WEBAUTHN_RP_ID }}
          APP_ADMIN_WEBAUTHN_RP_NAME=${{ secrets.APP_ADMIN_WEBAUTHN_RP_NAME }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_URL=${{ secrets.DB_URL }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          FIREBASE_KEY_BASE64=${{ secrets.FIREBASE_KEY_BASE64 }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}
          GCLOUD_PROJECT=${{ secrets.GCLOUD_PROJECT }}
          KAKAO_JAVASCRIPT_KEY=${{ secrets.KAKAO_JAVASCRIPT_KEY }}
          KAKAO_LOCAL_BASE_URL=${{ secrets.KAKAO_LOCAL_BASE_URL }}
          KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_PORT=${{ secrets.REDIS_PORT }}
          SHELTER_API_SERVICE_KEY=${{ secrets.SHELTER_API_SERVICE_KEY }}
          ENVEOF

          sed -i '/^DB_PASSWORD=/ s/\$/$$/g' .env
          APP_IMAGE="$(grep -E '^APP_IMAGE=' .env | cut -d= -f2-)"
          if [ -z "$APP_IMAGE" ]; then
            echo "APP_IMAGE is empty in .env"
            exit 1
          fi

          compose() {
            sudo docker compose --env-file "$APP_DIR/.env" -f "$APP_DIR/docker-compose.yml" "$@"
          }

          cleanup_docker_space() {
            echo "Docker disk usage before cleanup:"
            sudo docker system df || true
            sudo docker container prune -f || true
            sudo docker builder prune -af || true
            sudo docker image prune -af || true
            echo "Docker disk usage after cleanup:"
            sudo docker system df || true
          }

          cleanup_app_images() {
            app_repository="${APP_IMAGE%:*}"
            app_repository_without_registry="${app_repository#docker.io/}"
            keep_count="${1:-2}"

            echo "Cleaning old app images for $app_repository. Keeping latest $keep_count image(s)."
            image_refs="$(
              sudo docker image ls --format '{{.Repository}}\t{{.Tag}}\t{{.CreatedAt}}' |
                awk -F '\t' -v repo="$app_repository" -v short_repo="$app_repository_without_registry" '
                  $2 != "<none>" && ($1 == repo || $1 == short_repo) {
                    print $3 "\t" $1 ":" $2
                  }
                ' |
                sort -r |
                cut -f2-
            )"

            if [ -z "$image_refs" ]; then
              echo "No app images found for cleanup."
            else
              printf '%s\n' "$image_refs" |
                awk -v keep_count="$keep_count" 'NR > keep_count { print }' |
                while IFS= read -r image_ref; do
                  [ -z "$image_ref" ] && continue
                  echo "Removing old app image: $image_ref"
                  sudo docker rmi "$image_ref" || true
                done
            fi

            sudo docker image prune -f || true
          }

          # docker-compose.yml reads .env, then pulls the tagged app image and starts app + redis
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          cleanup_app_images 1
          cleanup_docker_space
          compose pull --quiet app
          redis_state="$(sudo docker inspect -f '{{.State.Running}} {{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' pogun-redis 2>/dev/null || true)"
          if ! echo "$redis_state" | grep -q '^true healthy'; then
            compose up -d --remove-orphans redis
          fi
          compose up -d --remove-orphans --no-deps app
          compose ps

          health_port="$(grep -E '^PORT=' .env | cut -d= -f2-)"
          health_port="${health_port:-8080}"
          health_url="http://127.0.0.1:${health_port}/health"
          for attempt in {1..60}; do
            if curl -fsS "$health_url" >/dev/null 2>&1; then
              echo "Application health endpoint passed: $health_url"
              break
            fi

            app_status="$(sudo docker inspect -f '{{.State.Status}}' pogun-backend)"
            app_health="$(sudo docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' pogun-backend)"

            if [ "$app_status" = "exited" ] || [ "$app_status" = "dead" ]; then
              compose logs --tail=200 app
              exit 1
            fi

            if [ "$attempt" -eq 60 ]; then
              compose logs --tail=200 app
              exit 1
            fi

            echo "Waiting for app healthcheck... status=$app_status health=$app_health attempt=$attempt/60"
            sleep 2
          done

          cleanup_app_images

          echo "Deploy completed. Docker app image cleanup finished."
          EOF
