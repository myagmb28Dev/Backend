name: Deploy To EC2

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: deploy-ec2-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: pawgun

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image_tag: ${{ steps.image-tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}

      - name: Build and test
        run: ./gradlew test bootJar --build-cache --parallel

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: image-tag
        run: |
          short_sha="${GITHUB_SHA::12}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true
          provenance: false
          sbom: false

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/pawgun_ec2_key <<'EOF'
          ${{ secrets.EC2_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/pawgun_ec2_key

      - name: Upload docker-compose.yml to EC2
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -o NumberOfPasswordPrompts=1 \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -i ~/.ssh/pawgun_ec2_key \
            -p "${{ secrets.EC2_PORT || 22 }}" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p '${{ secrets.EC2_APP_DIR }}' && cat > '${{ secrets.EC2_APP_DIR }}/docker-compose.yml'" < docker-compose.yml

      - name: Create .env on EC2 from GitHub secrets and deploy
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -o NumberOfPasswordPrompts=1 \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -i ~/.ssh/pawgun_ec2_key \
            -p "${{ secrets.EC2_PORT || 22 }}" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" <<'EOF'
          set -e
          APP_DIR="${{ secrets.EC2_APP_DIR }}"
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"

          if ! command -v docker >/dev/null 2>&1; then
            sudo dnf install -y docker
          fi
          if ! sudo systemctl is-active --quiet docker; then
            sudo systemctl start docker
          fi
          sudo systemctl enable docker >/dev/null 2>&1 || true

          if ! sudo docker compose version >/dev/null 2>&1; then
            arch="$(uname -m)"
            case "$arch" in
              x86_64) compose_arch="x86_64" ;;
              aarch64) compose_arch="aarch64" ;;
              *) echo "Unsupported architecture for Docker Compose: $arch"; exit 1 ;;
            esac
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-$compose_arch" \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            sudo docker compose version
          fi

          # GitHub Actions secrets are rendered into this heredoc and written to EC2 as .env
          cat > .env <<'ENVEOF'
          SPRING_PROFILES_ACTIVE=prod
          PORT=${{ secrets.PORT }}
          APP_IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}
          APP_STARTUP_WARMUP_ENABLED=true
          APP_SCHEMA_SYNC_ENABLED=true
          JAVA_STARTUP_OPTS=-XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+AlwaysPreTouch -XX:+UseStringDeduplication -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom
          AI_API_KEY=${{ secrets.AI_API_KEY }}
          APP_ADMIN_WEBAUTHN_ALLOWED_ORIGINS=${{ secrets.APP_ADMIN_WEBAUTHN_ALLOWED_ORIGINS }}
          APP_ADMIN_WEBAUTHN_ORIGIN_RP_MAP=${{ secrets.APP_ADMIN_WEBAUTHN_ORIGIN_RP_MAP }}
          APP_ADMIN_WEBAUTHN_RP_ID=${{ secrets.APP_ADMIN_WEBAUTHN_RP_ID }}
          APP_ADMIN_WEBAUTHN_RP_NAME=${{ secrets.APP_ADMIN_WEBAUTHN_RP_NAME }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_URL=${{ secrets.DB_URL }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          FIREBASE_KEY_BASE64=${{ secrets.FIREBASE_KEY_BASE64 }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID=${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_AUTH_DOMAIN=${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
          FIREBASE_WEB_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_PROJECT_ID=${{ secrets.FIREBASE_WEB_PROJECT_ID }}
          FIREBASE_WEB_STORAGE_BUCKET=${{ secrets.FIREBASE_WEB_STORAGE_BUCKET }}
          FIREBASE_WEB_VAPID_KEY=${{ secrets.FIREBASE_WEB_VAPID_KEY }}
          GCLOUD_PROJECT=${{ secrets.GCLOUD_PROJECT }}
          KAKAO_JAVASCRIPT_KEY=${{ secrets.KAKAO_JAVASCRIPT_KEY }}
          KAKAO_LOCAL_BASE_URL=${{ secrets.KAKAO_LOCAL_BASE_URL }}
          KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_PORT=${{ secrets.REDIS_PORT }}
          SHELTER_API_SERVICE_KEY=${{ secrets.SHELTER_API_SERVICE_KEY }}
          ENVEOF

          sed -i '/^DB_PASSWORD=/ s/\$/$$/g' .env

          compose() {
            sudo docker compose --env-file "$APP_DIR/.env" -f "$APP_DIR/docker-compose.yml" "$@"
          }

          # docker-compose.yml reads .env, then pulls the tagged app image and starts app + redis
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          compose pull --quiet app
          redis_state="$(sudo docker inspect -f '{{.State.Running}} {{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' pogun-redis 2>/dev/null || true)"
          if ! echo "$redis_state" | grep -q '^true healthy'; then
            compose up -d --remove-orphans redis
          fi
          compose up -d --remove-orphans --no-deps app
          compose ps

          health_port="$(grep -E '^PORT=' .env | cut -d= -f2-)"
          health_port="${health_port:-8080}"
          health_url="http://127.0.0.1:${health_port}/health"
          for attempt in {1..60}; do
            if curl -fsS "$health_url" >/dev/null 2>&1; then
              echo "Application health endpoint passed: $health_url"
              break
            fi

            app_status="$(sudo docker inspect -f '{{.State.Status}}' pogun-backend)"
            app_health="$(sudo docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' pogun-backend)"

            if [ "$app_status" = "exited" ] || [ "$app_status" = "dead" ]; then
              compose logs --tail=200 app
              exit 1
            fi

            if [ "$attempt" -eq 60 ]; then
              compose logs --tail=200 app
              exit 1
            fi

            echo "Waiting for app healthcheck... status=$app_status health=$app_health attempt=$attempt/60"
            sleep 2
          done

          echo "Deploy completed. Skipping docker image prune in hot deploy path."
          EOF
