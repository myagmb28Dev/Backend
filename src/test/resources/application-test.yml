spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:pogun_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

app:
  storage:
    s3:
      bucket: test-bucket
      region: ap-northeast-2
  startup-warmup:
    enabled: false
  schema-sync:
    enabled: false
  presence:
    store: memory
  firebase:
    auth:
      mode: EMULATOR
      allow-emulator: true
      project-id: pogun-test
      emulator-project-id: pogun-test
      web-api-key: test-key

FIREBASE_KEY_BASE64: ""
FIREBASE_CONFIG_JSON: ""
