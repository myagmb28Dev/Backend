spring:
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 320MB
  application:
    name: demo
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:20000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  web:
    resources:
      add-mappings: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    generate-ddl: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${JPA_SHOW_SQL:false}

app:
  schema-sync:
    enabled: ${APP_SCHEMA_SYNC_ENABLED:true}
  startup-warmup:
    enabled: ${APP_STARTUP_WARMUP_ENABLED:true}
  storage:
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
  kakao:
    local:
      rest-api-key: ${KAKAO_REST_API_KEY:}
      javascript-key: ${KAKAO_JAVASCRIPT_KEY:}
      base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
  firebase:
    auth:
      mode: ${APP_FIREBASE_AUTH_MODE:PRODUCTION}
      project-id: ${FIREBASE_PROJECT_ID:${GCLOUD_PROJECT:}}
      emulator-project-id: ${APP_FIREBASE_AUTH_EMULATOR_PROJECT_ID:${FIREBASE_AUTH_EMULATOR_PROJECT_ID:}}
      allow-emulator: ${APP_FIREBASE_AUTH_ALLOW_EMULATOR:${FIREBASE_ALLOW_AUTH_EMULATOR:false}}
      web-api-key: ${FIREBASE_WEB_API_KEY:${APP_FIREBASE_WEB_API_KEY:${FIREBASE_API_KEY:}}}
  admin:
    console:
      session-ttl-seconds: ${APP_ADMIN_SESSION_TTL_SECONDS:28800}
      bootstrap-session-ttl-seconds: ${APP_ADMIN_BOOTSTRAP_SESSION_TTL_SECONDS:900}
      challenge-ttl-seconds: ${APP_ADMIN_CHALLENGE_TTL_SECONDS:300}
      promote-stepup-ttl-seconds: 300
      webauthn:
        rp-id: ${APP_ADMIN_WEBAUTHN_RP_ID:localhost}
        rp-name: ${APP_ADMIN_WEBAUTHN_RP_NAME:Pogun Admin}
        allowed-origins: ${APP_ADMIN_WEBAUTHN_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
        origin-rp-map: ${APP_ADMIN_WEBAUTHN_ORIGIN_RP_MAP:http://localhost:8080=localhost,http://127.0.0.1:8080=localhost,http://localhost:8081=localhost,http://127.0.0.1:8081=localhost}
      email-verification:
        continue-url-map: ${APP_ADMIN_VERIFY_CONTINUE_URL_MAP:https://pawgen.kro.kr=https://pawgen.kro.kr/login?adminVerify=done}
        default-continue-url: ${APP_ADMIN_VERIFY_DEFAULT_CONTINUE_URL:https://pawgen.kro.kr/login?adminVerify=done}
  shelter:
    api:
      base-url: ${SHELTER_API_BASE_URL:https://apis.data.go.kr/1543061/abandonmentPublicService_v2}
      service-key: ${SHELTER_API_SERVICE_KEY:}
      abandonment-path: ${SHELTER_API_ABANDONMENT_PATH:/abandonmentPublic_v2}
  ai:
    api-key: ${AI_API_KEY:}
  ai-source-cache:
    enabled: true
    ttl-seconds: 60
  presence:
    store: redis
    reconcile-interval-ms: ${APP_PRESENCE_RECONCILE_INTERVAL_MS:1500}
  notification:
    inactive-token-retention-days: ${APP_NOTIFICATION_INACTIVE_TOKEN_RETENTION_DAYS:30}
    inactive-token-cleanup-cron: ${APP_NOTIFICATION_INACTIVE_TOKEN_CLEANUP_CRON:0 10 4 * * *}

decorator:
  datasource:
    p6spy:
      enable-logging: ${P6SPY_ENABLE_LOGGING:false}

springdoc:
  swagger-ui:
    url: /v3/api-docs

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:200}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:20}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT_MS:5000}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

---
# 로컬 개발 환경용 설정
spring:
  config:
    activate:
      on-profile: local
  data:
    redis:
      host: localhost
app:
  schema-sync:
    enabled: true
  startup-warmup:
    enabled: true

---
# 운영 환경용 설정
spring:
  config:
    activate:
      on-profile: prod
  data:
    redis:
      host: redis

