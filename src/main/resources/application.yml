spring:
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 320MB
  application:
    name: demo
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    generate-ddl: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${JPA_SHOW_SQL:false}

app:
  storage:
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
  kakao:
    local:
      rest-api-key: ${KAKAO_REST_API_KEY:}
      javascript-key: ${KAKAO_JAVASCRIPT_KEY:}
      base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
  firebase:
    auth:
      mode: ${APP_FIREBASE_AUTH_MODE:PRODUCTION}
      project-id: ${FIREBASE_PROJECT_ID:${GCLOUD_PROJECT:}}
      emulator-project-id: ${APP_FIREBASE_AUTH_EMULATOR_PROJECT_ID:${FIREBASE_AUTH_EMULATOR_PROJECT_ID:}}
      allow-emulator: ${APP_FIREBASE_AUTH_ALLOW_EMULATOR:${FIREBASE_ALLOW_AUTH_EMULATOR:false}}
      web-api-key: ${FIREBASE_WEB_API_KEY:${APP_FIREBASE_WEB_API_KEY:${FIREBASE_API_KEY:}}}
  admin:
    console:
      session-ttl-seconds: ${APP_ADMIN_SESSION_TTL_SECONDS:28800}
      bootstrap-session-ttl-seconds: ${APP_ADMIN_BOOTSTRAP_SESSION_TTL_SECONDS:900}
      challenge-ttl-seconds: ${APP_ADMIN_CHALLENGE_TTL_SECONDS:300}
      webauthn:
        rp-id: ${APP_ADMIN_WEBAUTHN_RP_ID:localhost}
        rp-name: ${APP_ADMIN_WEBAUTHN_RP_NAME:Pogun Admin}
        allowed-origins: ${APP_ADMIN_WEBAUTHN_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
  shelter:
    api:
      base-url: ${SHELTER_API_BASE_URL:https://apis.data.go.kr/1543061/abandonmentPublicService_v2}
      service-key: ${SHELTER_API_SERVICE_KEY:}
      abandonment-path: ${SHELTER_API_ABANDONMENT_PATH:/abandonmentPublic_v2}
  ai:
    api-key: ${AI_API_KEY:}
  ai-source-cache:
    enabled: true
    ttl-seconds: 60
  presence:
    store: redis
    reconcile-interval-ms: ${APP_PRESENCE_RECONCILE_INTERVAL_MS:3000}

decorator:
  datasource:
    p6spy:
      enable-logging: ${P6SPY_ENABLE_LOGGING:false}

springdoc:
  swagger-ui:
    url: /v3/api-docs

server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

---
# 로컬 개발 환경용 강제 설정
spring:
  config:
    activate:
      on-profile: local
  data:
    redis:
      host: localhost

---
# 운영 환경용 강제 설정
spring:
  config:
    activate:
      on-profile: prod
  data:
    redis:
      host: redis

