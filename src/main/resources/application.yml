spring:
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 320MB
  config:
    import:
      - optional:file:.env[.properties]
  application:
    name: demo
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    generate-ddl: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${JPA_SHOW_SQL:false}

app:
  storage:
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
  kakao:
    local:
      rest-api-key: ${KAKAO_REST_API_KEY:}
      javascript-key: ${KAKAO_JAVASCRIPT_KEY:}
      base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
  firebase:
    auth:
      mode: ${APP_FIREBASE_AUTH_MODE:PRODUCTION}
      project-id: ${FIREBASE_PROJECT_ID:${GCLOUD_PROJECT:}}
      allow-emulator: ${APP_FIREBASE_AUTH_ALLOW_EMULATOR:${FIREBASE_ALLOW_AUTH_EMULATOR:false}}
  shelter:
    api:
      base-url: ${SHELTER_API_BASE_URL:https://apis.data.go.kr/1543061/abandonmentPublicService_v2}
      service-key: ${SHELTER_API_SERVICE_KEY:}
      abandonment-path: ${SHELTER_API_ABANDONMENT_PATH:/abandonmentPublic_v2}
  ai:
    api-key: ${AI_API_KEY:}
  ai-source-cache:
    enabled: true
    ttl-seconds: 60
  presence:
    store: redis
    reconcile-interval-ms: ${APP_PRESENCE_RECONCILE_INTERVAL_MS:3000}

decorator:
  datasource:
    p6spy:
      enable-logging: ${P6SPY_ENABLE_LOGGING:false}

springdoc:
  swagger-ui:
    url: /v3/api-docs

server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
