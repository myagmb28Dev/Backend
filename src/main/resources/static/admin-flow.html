<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pogun Admin Report Flow</title>
  <style>
    :root { --ink:#24312f; --muted:#70817c; --line:#d9e1dc; --bg:#f4f0e8; --card:#fffaf0; --accent:#176b75; --danger:#b94134; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Georgia, "Noto Serif KR", serif; color:var(--ink); background:linear-gradient(135deg,#f4f0e8,#e6f0eb); }
    main { max-width:1120px; margin:0 auto; padding:32px 18px; }
    h1 { margin:0 0 8px; font-size:34px; }
    p { color:var(--muted); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .card { background:rgba(255,250,240,.94); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:0 16px 40px rgba(36,49,47,.08); }
    label { display:grid; gap:6px; font-size:13px; color:var(--muted); margin-bottom:10px; }
    input, select, textarea { width:100%; border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:white; color:var(--ink); }
    textarea { min-height:86px; resize:vertical; }
    button { border:0; border-radius:999px; padding:10px 14px; background:var(--accent); color:white; cursor:pointer; font-weight:700; }
    button.secondary { background:#52615d; }
    button.danger { background:var(--danger); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .reports { display:grid; gap:8px; margin-top:12px; }
    .report { text-align:left; width:100%; border:1px solid var(--line); background:white; color:var(--ink); border-radius:14px; padding:12px; }
    .report strong { display:block; margin-bottom:5px; }
    pre { white-space:pre-wrap; word-break:break-word; background:#22312f; color:#e8fff8; border-radius:14px; padding:14px; min-height:180px; }
    .status { margin:14px 0; padding:12px 14px; border-radius:14px; background:#e3efe9; color:#21453e; }
    .status.bad { background:#fde3dd; color:#7a2119; }
    @media (max-width: 860px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<main>
  <h1>관리자 신고 점검</h1>
  <p>ADMIN 권한 토큰으로 신고 목록, 상세, 검토 처리, 숨김/삭제/제재 액션을 확인합니다.</p>
  <div id="status" class="status">세션 확인 전</div>

  <section class="card">
    <label>Firebase ID Token
      <input id="tokenInput" placeholder="login-flow.html 세션 또는 URL token 파라미터를 자동 사용합니다">
    </label>
    <div class="row">
      <button id="saveTokenButton" class="secondary">토큰 저장</button>
      <button id="loadReportsButton">신고 목록 조회</button>
    </div>
  </section>

  <div class="grid" style="margin-top:16px;">
    <section class="card">
      <h2>신고 목록</h2>
      <div class="row">
        <select id="statusFilter">
          <option value="">전체 상태</option>
          <option>RECEIVED</option>
          <option>REVIEWING</option>
          <option>RESOLVED</option>
          <option>REJECTED</option>
        </select>
        <select id="targetTypeFilter">
          <option value="">전체 대상</option>
          <option>PET_NOTICE</option>
          <option>NOTICE_CHAT_ROOM</option>
          <option>COMMUNITY_POST</option>
          <option>COMMUNITY_COMMENT</option>
          <option>USER</option>
        </select>
      </div>
      <div id="reportList" class="reports"></div>
    </section>

    <section class="card">
      <h2>상세 / 처리</h2>
      <label>선택 신고 ID<input id="reportIdInput"></label>
      <div class="row">
        <button id="loadDetailButton" class="secondary">상세 조회</button>
      </div>
      <label>처리 상태
        <select id="reviewStatus">
          <option>REVIEWING</option>
          <option>RESOLVED</option>
          <option>REJECTED</option>
          <option>RECEIVED</option>
        </select>
      </label>
      <label>처리 액션
        <select id="processAction">
          <option>NONE</option>
          <option>HIDE_TARGET</option>
          <option>DELETE_TARGET</option>
          <option>SANCTION_TARGET_USER</option>
        </select>
      </label>
      <label>처리 사유<textarea id="processReason" placeholder="관리자 처리 사유"></textarea></label>
      <button id="reviewButton" class="danger">신고 검토 처리</button>
    </section>
  </div>

  <section class="card" style="margin-top:16px;">
    <h2>응답</h2>
    <pre id="output">{}</pre>
  </section>
</main>
<script>
const BACKEND_BASE = window.location.origin;
const SESSION_KEY = "pogun-real-firebase-session-v1";
const ADMIN_TOKEN_KEY = "pogun-admin-flow-token-v1";
const query = new URLSearchParams(window.location.search);
const el = (id) => document.getElementById(id);

function sessionToken() {
  const queryToken = (query.get("token") || query.get("firebaseIdToken") || "").trim();
  if (queryToken) return queryToken;
  try {
    const savedAdminToken = window.localStorage.getItem(ADMIN_TOKEN_KEY);
    if (savedAdminToken) return savedAdminToken;
    const session = JSON.parse(window.localStorage.getItem(SESSION_KEY) || "null");
    return session?.idToken || session?.token || "";
  } catch {
    return "";
  }
}

function setStatus(message, bad = false) {
  el("status").textContent = message;
  el("status").className = bad ? "status bad" : "status";
}

function print(value) {
  el("output").textContent = JSON.stringify(value, null, 2);
}

async function api(path, init = {}) {
  const token = el("tokenInput").value.trim();
  if (!token) throw new Error("ADMIN 토큰을 입력하세요.");
  const response = await fetch(`${BACKEND_BASE}${path}`, {
    ...init,
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${token}`,
      ...(init.headers || {})
    }
  });
  const text = await response.text();
  const body = text ? JSON.parse(text) : null;
  if (!response.ok) throw new Error(JSON.stringify(body));
  return body;
}

async function loadReports() {
  const params = new URLSearchParams({ page: "0", size: "20" });
  if (el("statusFilter").value) params.set("status", el("statusFilter").value);
  if (el("targetTypeFilter").value) params.set("targetType", el("targetTypeFilter").value);
  const body = await api(`/api/admin/reports?${params}`);
  print(body);
  const items = body?.data?.items || [];
  el("reportList").innerHTML = "";
  for (const report of items) {
    const button = document.createElement("button");
    button.className = "report";
    button.innerHTML = `<strong>${report.targetType} · ${report.status}</strong>${report.id}<br>${report.reason || ""}`;
    button.addEventListener("click", () => {
      el("reportIdInput").value = report.id;
      loadDetail().catch(showError);
    });
    el("reportList").appendChild(button);
  }
  setStatus(`신고 ${items.length}건 조회 완료`);
}

async function loadDetail() {
  const reportId = el("reportIdInput").value.trim();
  if (!reportId) throw new Error("신고 ID를 입력하세요.");
  const body = await api(`/api/admin/reports/${reportId}`);
  print(body);
  setStatus("신고 상세 조회 완료");
}

async function reviewReport() {
  const reportId = el("reportIdInput").value.trim();
  if (!reportId) throw new Error("신고 ID를 입력하세요.");
  const body = await api(`/api/admin/reports/${reportId}/review`, {
    method: "PATCH",
    body: JSON.stringify({
      status: el("reviewStatus").value,
      processAction: el("processAction").value,
      processReason: el("processReason").value.trim() || null
    })
  });
  print(body);
  setStatus("신고 검토 처리 완료");
  await loadReports();
}

function showError(error) {
  console.error(error);
  setStatus(error.message || String(error), true);
}

el("tokenInput").value = sessionToken();
el("saveTokenButton").addEventListener("click", () => {
  window.localStorage.setItem(ADMIN_TOKEN_KEY, el("tokenInput").value.trim());
  setStatus("관리자 토큰 저장 완료");
});
el("loadReportsButton").addEventListener("click", () => loadReports().catch(showError));
el("loadDetailButton").addEventListener("click", () => loadDetail().catch(showError));
el("reviewButton").addEventListener("click", () => reviewReport().catch(showError));
el("statusFilter").addEventListener("change", () => loadReports().catch(showError));
el("targetTypeFilter").addEventListener("change", () => loadReports().catch(showError));
setStatus(el("tokenInput").value ? "토큰 준비됨. 신고 목록을 조회하세요." : "ADMIN 토큰을 입력하세요.");
</script>
</body>
</html>
