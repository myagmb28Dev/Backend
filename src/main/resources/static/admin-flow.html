<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pogun Admin Console</title>
  <style>
    :root { --bg:#f6f1e8; --card:#fffaf0; --ink:#1f2933; --muted:#6b7280; --line:#dac9b2; --accent:#176b75; --good:#1f8a4c; --bad:#b42318; --admin:#c05f2c; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); }
    main { width:min(1120px,calc(100% - 28px)); margin:20px auto; display:grid; gap:14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:0 10px 26px rgba(31,41,51,.06); }
    h1,h2,p { margin:0; }
    .page-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .status { min-height:40px; padding:10px 12px; border-radius:12px; background:rgba(31,41,51,.06); color:var(--muted); font-size:13px; font-weight:700; margin-top:10px; }
    .status.good { background:rgba(31,138,76,.12); color:var(--good); }
    .status.bad { background:rgba(180,35,24,.10); color:var(--bad); }
    .muted { color:var(--muted); font-size:12px; margin-top:8px; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
    label { display:grid; gap:5px; color:var(--muted); font-size:12px; font-weight:800; margin-top:10px; }
    input, select, textarea { width:100%; border:1px solid rgba(31,41,51,.14); border-radius:8px; padding:11px 12px; background:#fff; color:var(--ink); font:inherit; font-weight:700; }
    textarea { min-height:100px; resize:vertical; }
    button { border:0; border-radius:12px; padding:11px 14px; font-weight:800; cursor:pointer; color:#fff; background:var(--accent); }
    button.secondary { background:rgba(31,41,51,.11); color:var(--ink); }
    button.admin { background:var(--admin); }
    button.danger { background:var(--bad); }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    .reports { display:grid; gap:8px; margin-top:12px; }
    .report-item { text-align:left; width:100%; border:1px solid var(--line); background:white; color:var(--ink); border-radius:12px; padding:12px; cursor:pointer; }
    .report-item:hover { border-color:var(--accent); }
    .report-item strong { display:block; margin-bottom:4px; font-size:14px; }
    .report-item span { font-size:12px; color:var(--muted); }
    pre { white-space:pre-wrap; word-break:break-all; background:#1f2933; color:#e8fff8; border-radius:12px; padding:14px; font-size:12px; margin-top:10px; max-height:400px; overflow-y:auto; }
    .traffic-alert { margin-top:10px; padding:10px 12px; border-radius:10px; font-size:12px; font-weight:800; border:1px solid rgba(31,41,51,.14); background:#fff; color:var(--ink); display:none; }
    .traffic-alert.show { display:block; background:rgba(31,138,76,.12); border-color:rgba(31,138,76,.35); color:var(--good); }
    .traffic-toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center; }
    .traffic-chip { border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--ink); font-size:12px; padding:5px 10px; cursor:pointer; }
    .traffic-chip.active { border-color:var(--accent); background:rgba(23,107,117,.12); }
    .traffic-badge { display:inline-block; min-width:22px; padding:2px 7px; border-radius:999px; background:#1f2933; color:#fff; font-size:11px; text-align:center; }
    @media (max-width:860px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<main>
  <section class="card">
    <div class="page-head">
      <div>
        <h1>Admin Console</h1>
        <p class="muted">관리자 계정(Google 소셜 로그인)으로 로그인하여 패널을 이용하세요.</p>
      </div>
      <div class="actions">
        <button id="logoutButton" class="secondary" style="display:none;">로그아웃</button>
        <button id="localAdminButton" class="secondary" style="display:none; padding:7px 10px; font-size:12px;">로컬 테스트 로그인</button>
      </div>
    </div>
    <div id="status" class="status">관리자 로그인이 필요합니다.</div>
    
    <!-- 1단계: Google 로그인 -->
    <form id="loginForm" style="margin-top:15px; border-top:1px solid var(--line); padding-top:15px;">
        <div class="actions" style="margin-top:10px;">
            <button id="loginButton" type="submit" class="admin">Google로 관리자 로그인</button>
        </div>
    </form>

    <!-- 2단계: 패스키 등록/인증 섹션 -->
    <div id="passkeySection" class="actions" style="display:none; margin-top:15px; border-top:1px solid var(--line); padding-top:15px;">
        <p id="passkeyMessage" style="width:100%; font-weight:bold; color:var(--admin);">패스키 인증이 필요합니다.</p>
        <button id="registerPasskeyButton" class="admin" style="display:none;">패스키(Passkey) 등록하기</button>
        <button id="mfaButton" class="admin" style="display:none;">패스키(Passkey) 인증하기</button>
    </div>
  </section>

  <!-- 3단계: 관리자 패널 -->
  <div id="adminPanel" style="display:none;">
    <div class="grid">
      <section class="card">
        <h2>신고 목록</h2>
        <div class="actions">
          <select id="statusFilter">
            <option value="">전체 상태</option>
            <option value="PENDING">PENDING</option>
            <option value="REVIEWING">REVIEWING</option>
            <option value="RESOLVED">RESOLVED</option>
            <option value="REJECTED">REJECTED</option>
          </select>
          <button id="refreshReportsButton">새로고침</button>
        </div>
        <div id="reportList" class="reports"></div>
      </section>

      <section class="card">
        <h2>상세 및 검토</h2>
        <label>신고 ID<input id="reportIdInput" readonly></label>
        <div class="grid" style="grid-template-columns:1fr 1fr; margin-top:0;">
          <label>처리 상태
            <select id="reviewStatus">
              <option value="REVIEWING">REVIEWING</option>
              <option value="RESOLVED">RESOLVED</option>
              <option value="REJECTED">REJECTED</option>
            </select>
          </label>
          <label>처리 액션
            <select id="processAction">
              <option value="NONE">NONE</option>
              <option value="HIDE_TARGET">HIDE_TARGET</option>
              <option value="DELETE_TARGET">DELETE_TARGET</option>
              <option value="SANCTION_TARGET_USER">SANCTION_TARGET_USER</option>
            </select>
          </label>
        </div>
        <label>처리 사유<textarea id="processReason" placeholder="처리 사유를 입력하세요"></textarea></label>
        <div class="actions" style="margin-top:14px">
          <button id="reviewButton" class="admin">신고 검토 처리</button>
        </div>
      </section>
    </div>

    <section class="card" style="margin-top:14px;">
      <h2>사용자 관리</h2>
      <div class="grid" style="grid-template-columns: 2fr 1fr; align-items: end;">
        <label>관리자로 승격할 이메일
          <input id="promoteEmailInput" type="email" placeholder="user@local.dev">
        </label>
        <button id="promoteButton" class="danger">관리자 승격</button>
      </div>
    </section>

    <section class="card" style="margin-top:14px;">
      <h2>최근 응답</h2>
      <pre id="output">{}</pre>
    </section>

    <section class="card" style="margin-top:14px;">
      <h2>요청 콘솔</h2>
      <div id="trafficAlert" class="traffic-alert">신규 요청 없음</div>
      <div id="trafficToolbar" class="traffic-toolbar"></div>
      <pre id="trafficOutput">[]</pre>
    </section>
  </div>
</main>

<script type="module">
  import { ensureLocalAdminTestUserVerified } from "./admin-local-bootstrap.js";
  import { getApp, getApps, initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import {
    GoogleAuthProvider,
    browserLocalPersistence,
    getAuth,
    setPersistence,
    signInWithPopup
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { FIREBASE_WEB_CONFIG } from "./firebase-web-config.js";

  const BACKEND_BASE = window.location.origin;
  const ADMIN_ACCESS_TOKEN_KEY = "pogun-admin-access-token-v1";
  const LOCAL_ADMIN_EMAIL = "playwright-user1@local.dev";

  const el = (id) => document.getElementById(id);
  function setStatus(msg, tone = "") {
    const node = el("status");
    node.textContent = msg;
    node.className = `status${tone ? " " + tone : ""}`;
  }
  function print(val) {
    el("output").textContent = JSON.stringify(val, null, 2);
  }
  function printTraffic(lines) {
    el("trafficOutput").textContent = lines.join("\n");
  }
  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll("\"", "&quot;")
      .replaceAll("'", "&#39;");
  }

  function resolvePublicKeyOptions(payload) {
    const candidate = payload?.publicKey || payload;
    if (candidate?.publicKey && !candidate?.challenge) {
      return candidate.publicKey;
    }
    return candidate;
  }

  function pickBase64Url(value) {
    if (typeof value === "string") return value;
    if (!value || typeof value !== "object") return null;
    if (typeof value.base64Url === "string") return value.base64Url;
    if (typeof value.value === "string") return value.value;
    return null;
  }

  function credentialToJson(value) {
    if (value == null) return value;
    if (value instanceof ArrayBuffer || ArrayBuffer.isView(value)) {
      return bufferToBase64(value);
    }
    if (value instanceof PublicKeyCredential) {
      return {
        id: value.id,
        type: value.type,
        rawId: credentialToJson(value.rawId),
        response: credentialToJson(value.response),
        authenticatorAttachment: value.authenticatorAttachment,
        clientExtensionResults: value.getClientExtensionResults()
      };
    }
    if (value instanceof AuthenticatorAttestationResponse) {
      return {
        clientDataJSON: credentialToJson(value.clientDataJSON),
        attestationObject: credentialToJson(value.attestationObject),
        transports: typeof value.getTransports === "function" ? value.getTransports() : []
      };
    }
    if (value instanceof AuthenticatorAssertionResponse) {
      return {
        clientDataJSON: credentialToJson(value.clientDataJSON),
        authenticatorData: credentialToJson(value.authenticatorData),
        signature: credentialToJson(value.signature),
        userHandle: value.userHandle ? credentialToJson(value.userHandle) : null
      };
    }
    if (Array.isArray(value)) {
      return value.map(credentialToJson);
    }
    if (typeof value === "object") {
      return Object.fromEntries(Object.entries(value).map(([key, entry]) => [key, credentialToJson(entry)]));
    }
    return value;
  }

  let adminAccessToken = null;
  let bootstrapToken = null;
  let firebaseAuthInstance = null;
  let currentGoogleUser = null;
  let passkeyRegisterRetrying = false;

  function isLocalAdminShortcutAllowed() {
    const host = window.location.hostname;
    return (host === "localhost" || host === "127.0.0.1") && window.location.port === "8081";
  }

  async function getFirebaseAuthInstance() {
    if (firebaseAuthInstance) return firebaseAuthInstance;
    const app = getApps().length > 0 ? getApp() : initializeApp(FIREBASE_WEB_CONFIG);
    firebaseAuthInstance = getAuth(app);
    await setPersistence(firebaseAuthInstance, browserLocalPersistence);
    return firebaseAuthInstance;
  }

  async function request(url, init = {}) {
    const headers = { "Content-Type": "application/json", ...init.headers };
    const token = adminAccessToken || bootstrapToken;
    if (token) {
      headers["Authorization"] = `Bearer ${token}`;
    }
    const response = await fetch(`${BACKEND_BASE}${url}`, { ...init, headers });
    const text = await response.text();
    let body;
    try { body = text ? JSON.parse(text) : null; } catch { body = text; }
    return { ok: response.ok, status: response.status, body };
  }

  async function login() {
    const auth = await getFirebaseAuthInstance();
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    setStatus("Google 관리자 로그인 진행 중...");
    const result = await signInWithPopup(auth, provider);
    const user = result?.user;
    if (!user) {
      throw new Error("Google 로그인 결과에서 사용자 정보를 확인할 수 없습니다.");
    }
    currentGoogleUser = user;
    const token = await user.getIdToken(true);
    const res = await request("/api/admin/auth/login", {
      method: "POST",
      body: JSON.stringify({ firebaseIdToken: token })
    });

    if (!res.ok) {
      const errorCode = res.body?.error?.code || `HTTP_${res.status}`;
      const errorMessage = res.body?.error?.message || res.body?.message || "응답을 확인하세요.";
      setStatus(`로그인 실패: ${errorCode} - ${errorMessage}`, "bad");
      print(res.body);
      return;
    }

    print(res.body);
    handleAdminLoginResponse(res.body.data);
  }

  function handleAdminLoginResponse(data) {
    if (data.nextStep === "PASSKEY_REGISTRATION_REQUIRED") {
      bootstrapToken = data.session.accessToken;
      el("loginForm").style.display = "none";
      el("passkeySection").style.display = "flex";
      el("registerPasskeyButton").style.display = "inline-block";
      el("mfaButton").style.display = "none";
      el("passkeyMessage").textContent = "최초 1회 패스키 등록이 필요합니다.";
      setStatus("패스키 등록 단계", "admin");
      return;
    }
    if (data.nextStep === "EMAIL_VERIFICATION_REQUIRED") {
      setStatus("관리자 이메일 인증 메일을 전송했습니다. 받은 메일의 링크를 클릭한 뒤 다시 로그인하세요.", "good");
      el("passkeySection").style.display = "none";
      el("logoutButton").style.display = "none";
      return;
    }
    if (data.nextStep === "PASSKEY_REQUIRED") {
      bootstrapToken = data.session.accessToken;
      el("loginForm").style.display = "none";
      el("passkeySection").style.display = "flex";
      el("registerPasskeyButton").style.display = "none";
      el("mfaButton").style.display = "inline-block";
      el("passkeyMessage").textContent = "등록된 패스키로 2단계 인증을 완료하세요.";
      setStatus("패스키 인증 단계", "admin");
      return;
    }
    if (data.accessToken) {
      adminAccessToken = data.accessToken;
      localStorage.setItem(ADMIN_ACCESS_TOKEN_KEY, adminAccessToken);
      finalizeLogin();
    }
  }

  async function localAdminLogin() {
    setStatus("로컬 테스트 관리자 준비 중...");
    await ensureLocalAdminTestUserVerified({ email: LOCAL_ADMIN_EMAIL, projectId: "pogun-local" });
    const res = await request("/api/admin/auth/login", {
      method: "POST",
      body: JSON.stringify({
        localTest: true,
        localTestEmail: LOCAL_ADMIN_EMAIL,
        forcePasskeyEnroll: true
      })
    });
    if (!res.ok) {
      setStatus("로컬 테스트 로그인 실패", "bad");
      print(res.body);
      return;
    }
    print(res.body);
    handleAdminLoginResponse(res.body.data);
  }

  async function handlePasskeyRegistration() {
    setStatus("패스키 등록 옵션 가져오는 중...");
    const optionsRes = await request("/api/admin/auth/passkeys/register/options", { method: "POST" });
    if (!optionsRes.ok) {
      const code = optionsRes.body?.error?.code || `HTTP_${optionsRes.status}`;
      const msg = optionsRes.body?.error?.message || optionsRes.body?.message || "응답 본문 확인";
      // 로컬 shortcut 세션이 만료/단계 불일치면 1회 자동 복구 후 재시도
      if (!passkeyRegisterRetrying
        && isLocalAdminShortcutAllowed()
        && (code === "ADMIN_SESSION_REQUIRED" || code === "ADMIN_AUTH_STEP_INVALID")
      ) {
        passkeyRegisterRetrying = true;
        try {
          setStatus("로컬 관리자 세션 재발급 중...");
          await localAdminLogin();
          await handlePasskeyRegistration();
          return;
        } finally {
          passkeyRegisterRetrying = false;
        }
      }
      setStatus(`등록 옵션 발급 실패: ${code}`, "bad");
      print({ code, message: msg, raw: optionsRes.body });
      return;
    }

    const options = optionsRes.body.data;
    const publicKey = resolvePublicKeyOptions(options);

    try {
        setStatus("브라우저 패스키 창 대기 중...");
        const credential = await createPasskey(publicKey);
        
        setStatus("패스키 검증 중...");
        const verifyRes = await request("/api/admin/auth/passkeys/register/verify", {
            method: "POST",
            body: JSON.stringify({
                challengeId: options.challengeId,
                credential: credential
            })
        });

        if (verifyRes.ok) {
            adminAccessToken = verifyRes.body.data.accessToken || verifyRes.body.data.session?.accessToken;
            localStorage.setItem(ADMIN_ACCESS_TOKEN_KEY, adminAccessToken);
            finalizeLogin();
        } else {
            setStatus("패스키 검증 실패", "bad");
            print(verifyRes.body);
        }
    } catch (err) {
        setStatus("패스키 등록 오류: " + err.message, "bad");
    }
  }

  async function handleMfa() {
    setStatus("MFA 인증 옵션 가져오는 중...");
    const optionsRes = await request("/api/admin/auth/mfa/options", { method: "POST" });
    if (!optionsRes.ok) {
        setStatus("MFA 옵션 발급 실패", "bad");
        print(optionsRes.body);
        return;
    }

    const options = optionsRes.body.data;
    const publicKey = resolvePublicKeyOptions(options);

    try {
        setStatus("패스키 인증 대기 중...");
        const credential = await getPasskey(publicKey);
        
        setStatus("MFA 검증 중...");
        const verifyRes = await request("/api/admin/auth/mfa/verify", {
            method: "POST",
            body: JSON.stringify({
                challengeId: options.challengeId,
                credential: credential
            })
        });

        if (verifyRes.ok) {
            adminAccessToken = verifyRes.body.data.accessToken || verifyRes.body.data.session?.accessToken;
            localStorage.setItem(ADMIN_ACCESS_TOKEN_KEY, adminAccessToken);
            finalizeLogin();
        } else {
          setStatus("MFA 검증 실패, 패스키 재등록으로 전환합니다.", "bad");
            print(verifyRes.body);
          await resetPasskeys(true);
        }
    } catch (err) {
        setStatus("MFA 인증 실패, 패스키 재등록으로 전환합니다.", "bad");
        await resetPasskeys(true);
    }
  }

      async function resetPasskeys(fromAutoFallback = false) {
    setStatus("서버에 저장된 패스키를 초기화하는 중...");
    const res = await request("/api/admin/auth/passkeys/reset", { method: "POST" });
    if (!res.ok) {
      setStatus("패스키 초기화 실패", "bad");
      print(res.body);
      return;
    }

    bootstrapToken = res.body.data.accessToken || bootstrapToken;
    el("registerPasskeyButton").style.display = "inline-block";
    el("mfaButton").style.display = "none";
    el("passkeyMessage").textContent = "패스키가 초기화되었습니다. 새 패스키를 등록하세요.";
    setStatus(fromAutoFallback ? "패스키 미일치 감지: 재등록 단계로 전환했습니다." : "패스키 재등록 단계", "good");
    print(res.body);
  }

  function finalizeLogin() {
    el("loginForm").style.display = "none";
    el("passkeySection").style.display = "none";
    el("adminPanel").style.display = "block";
    el("logoutButton").style.display = "inline-block";
    setStatus("관리자 인증 완료", "good");
    loadReports();
    startTrafficPolling();
  }

  async function logout() {
    if (trafficPollTimer) {
      clearInterval(trafficPollTimer);
      trafficPollTimer = null;
    }
    await request("/api/admin/auth/logout", { method: "POST" });
    localStorage.removeItem(ADMIN_ACCESS_TOKEN_KEY);
    location.reload();
  }

  // WebAuthn 도우미 함수들
  async function createPasskey(publicKey) {
    const challenge = pickBase64Url(publicKey?.challenge);
    const userId = pickBase64Url(publicKey?.user?.id);
    const options = {
        publicKey: {
            ...publicKey,
        challenge: base64ToBuffer(challenge, "challenge"),
        user: { ...publicKey.user, id: base64ToBuffer(userId, "user.id") },
        excludeCredentials: (publicKey.excludeCredentials || []).map(c => ({ ...c, id: base64ToBuffer(pickBase64Url(c.id), "excludeCredentials.id") }))
        }
    };
    const credential = await navigator.credentials.create(options);
      return credentialToJson(credential);
  }

  async function getPasskey(publicKey) {
    const challenge = pickBase64Url(publicKey?.challenge);
    const options = {
        publicKey: {
            ...publicKey,
        challenge: base64ToBuffer(challenge, "challenge"),
        allowCredentials: (publicKey.allowCredentials || []).map(c => ({ ...c, id: base64ToBuffer(pickBase64Url(c.id), "allowCredentials.id") }))
        }
    };
    const assertion = await navigator.credentials.get(options);
      return credentialToJson(assertion);
  }

  function base64ToBuffer(base64, fieldName = "value") {
    if (typeof base64 !== "string" || !base64.length) {
      throw new Error(`Passkey 옵션 형식 오류: ${fieldName}`);
    }
    const padding = '='.repeat((4 - (base64.length % 4)) % 4);
    const normalized = (base64 + padding).replace(/-/g, '+').replace(/_/g, '/');
    const binary = window.atob(normalized);
    const buffer = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) buffer[i] = binary.charCodeAt(i);
    return buffer.buffer;
  }

  function bufferToBase64(buffer) {
    const binary = String.fromCharCode(...new Uint8Array(buffer));
    return window.btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  }

  async function loadReports() {
    const status = el("statusFilter").value;
    const url = `/api/admin/reports?page=1&pageSize=20${status ? `&status=${status}` : ""}`;
    const res = await request(url);
    if (!res.ok) return setStatus("신고 목록 로딩 실패", "bad");
    const items = res.body.data.items || [];
    el("reportList").innerHTML = "";
    items.forEach(item => {
      const div = document.createElement("div");
      div.className = "report-item";
      div.innerHTML = `<strong>${item.targetType} [${item.status}]</strong><span>ID: ${item.id}</span><br><span>이유: ${item.reason}</span>`;
      div.onclick = () => {
        el("reportIdInput").value = item.id;
        el("reviewStatus").value = item.status === "PENDING" ? "REVIEWING" : item.status;
      };
      el("reportList").appendChild(div);
    });
  }

  async function reviewReport() {
    const id = el("reportIdInput").value;
    if (!id) return;
    const body = { status: el("reviewStatus").value, processAction: el("processAction").value, processReason: el("processReason").value };
    const res = await request(`/api/admin/reports/${id}/review`, { method: "PATCH", body: JSON.stringify(body) });
    if (res.ok) { setStatus("신고 처리 완료", "good"); loadReports(); }
    else setStatus("신고 처리 실패", "bad");
  }

  async function promoteUser() {
    const email = el("promoteEmailInput").value.trim();
    if (!email) return;
    const res = await request("/api/admin/users/promote", { method: "PATCH", body: JSON.stringify({ email }) });
    if (res.ok) setStatus(`${email} 승격 완료`, "good");
    else setStatus("승격 실패", "bad");
  }

  let trafficPollTimer = null;
  const trafficSeen = new Set();
  const TRAFFIC_TRACKED_API_PREFIXES = [
    "/api/missing-pets",
    "/api/shelter",
    "/api/reports",
    "/api/admin",
    "/api/community/posts",
    "/api/community"
  ];
  let selectedTrafficGroup = "ALL";

  function isTrackedApiPath(path) {
    if (!path || typeof path !== "string") return false;
    const clean = path.split("?")[0];
    if (!clean.startsWith("/api/")) return false;
    return TRAFFIC_TRACKED_API_PREFIXES.some((prefix) => clean.startsWith(prefix));
  }

  function getApiGroup(path) {
    if (!path || typeof path !== "string") return "UNKNOWN";
    const clean = path.split("?")[0];
    const parts = clean.split("/").filter(Boolean);
    if (parts.length < 3) return clean || "UNKNOWN";
    return `/${parts[0]}/${parts[1]}/${parts[2]}`;
  }

  function buildTrafficLine(row) {
    const ts = row.timestamp || "-";
    const dir = row.direction || "-";
    const method = row.method || "-";
    const path = row.path || "-";
    const status = row.status ?? "-";
    const duration = row.durationMs ?? "-";
    const source = row.remoteAddr || "-";
    return `${ts} ${dir} ${method} ${path} status=${status} durationMs=${duration} source=${source}`;
  }

  function renderTrafficToolbar(grouped) {
    const host = el("trafficToolbar");
    const groups = [...TRAFFIC_TRACKED_API_PREFIXES];
    const allCount = groups.reduce((acc, key) => acc + ((grouped[key] || []).length), 0);
    const groupItems = [{ key: "ALL", count: allCount }, ...groups.map((key) => ({ key, count: (grouped[key] || []).length }))];
    host.innerHTML = groupItems.map((item) => {
      const active = item.key === selectedTrafficGroup ? "active" : "";
      return `<button type="button" class="traffic-chip ${active}" data-group="${escapeHtml(item.key)}">${escapeHtml(item.key)} <span class="traffic-badge">${item.count}</span></button>`;
    }).join("");
    host.querySelectorAll("button[data-group]").forEach((button) => {
      button.addEventListener("click", () => {
        selectedTrafficGroup = button.dataset.group || "ALL";
        renderTrafficToolbar(grouped);
        renderTrafficOutput(grouped);
      });
    });
  }

  function renderTrafficOutput(grouped) {
    const groups = [...TRAFFIC_TRACKED_API_PREFIXES];
    let rows = [];
    if (selectedTrafficGroup === "ALL") {
      rows = groups.flatMap((group) => (grouped[group] || []).slice(0, 20));
    } else {
      rows = (grouped[selectedTrafficGroup] || []).slice(0, 40);
    }
    printTraffic(rows.map(buildTrafficLine));
  }

  function renderTrafficAlert(totalFresh, freshByGroup) {
    const alertNode = el("trafficAlert");
    if (!totalFresh) {
      alertNode.className = "traffic-alert";
      alertNode.textContent = "신규 요청 없음";
      return;
    }
    const top = [...freshByGroup.entries()]
      .sort((a, b) => b[1] - a[1])
      .slice(0, 3)
      .map(([group, count]) => `${group} ${count}`)
      .join(" | ");
    alertNode.className = "traffic-alert show";
    alertNode.textContent = `신규 요청 ${totalFresh}건 도착: ${top}`;
  }

  async function loadTrafficLogs() {
    const res = await request("/api/admin/traffic/logs?limit=100");
    if (!res.ok) return;
    const rows = (Array.isArray(res.body?.data) ? res.body.data : [])
      .filter((row) => isTrackedApiPath(row?.path));
    const grouped = {};
    const freshByGroup = new Map();
    let totalFresh = 0;
    for (const row of rows) {
      const group = getApiGroup(row.path);
      if (!grouped[group]) grouped[group] = [];
      grouped[group].push(row);
      const uniqKey = `${row.timestamp || ""}|${row.direction || ""}|${row.method || ""}|${row.path || ""}|${row.status ?? ""}|${row.durationMs ?? ""}|${row.remoteAddr || ""}`;
      if (!trafficSeen.has(uniqKey)) {
        trafficSeen.add(uniqKey);
        totalFresh += 1;
        freshByGroup.set(group, (freshByGroup.get(group) || 0) + 1);
      }
    }
    renderTrafficToolbar(grouped);
    renderTrafficOutput(grouped);
    renderTrafficAlert(totalFresh, freshByGroup);
  }

  function startTrafficPolling() {
    if (trafficPollTimer) clearInterval(trafficPollTimer);
    loadTrafficLogs().catch(() => {});
    trafficPollTimer = setInterval(() => {
      loadTrafficLogs().catch(() => {});
    }, 2000);
  }

  el("loginForm").addEventListener("submit", (event) => {
    event.preventDefault();
    login().catch((error) => {
      console.error(error);
      setStatus(error.message || String(error), "bad");
    });
  });
  el("logoutButton").onclick = logout;
  el("localAdminButton").onclick = () => {
    localAdminLogin().catch((error) => {
      console.error(error);
      setStatus(error.message || String(error), "bad");
    });
  };
  el("registerPasskeyButton").onclick = handlePasskeyRegistration;
  el("mfaButton").onclick = handleMfa;
  el("refreshReportsButton").onclick = loadReports;
  el("statusFilter").onchange = loadReports;
  el("reviewButton").onclick = reviewReport;
  el("promoteButton").onclick = promoteUser;

  // 세션 복원 시도
  const savedToken = localStorage.getItem(ADMIN_ACCESS_TOKEN_KEY);
  if (savedToken) {
      adminAccessToken = savedToken;
      request("/api/admin/auth/session").then(res => {
          if (res.ok && res.body.data.authenticated) finalizeLogin();
          else { localStorage.removeItem(ADMIN_ACCESS_TOKEN_KEY); setStatus("세션이 만료되었습니다."); }
      });
  } else {
      setStatus("Google 관리자 로그인 후 패스키 인증까지 완료해야 접속됩니다.");
  }

  if (isLocalAdminShortcutAllowed()) {
    el("localAdminButton").style.display = "inline-block";
  }
</script>
</body>
</html>
