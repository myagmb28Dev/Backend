<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice Chat Test</title>
    <style>
        :root {
            --bg: #f4f1ea;
            --card: #fffdf8;
            --line: #e4dac9;
            --text: #2e2a24;
            --muted: #7f7668;
            --accent: #4d7c5f;
            --accent-strong: #355a43;
            --bubble-me: #dff3e7;
            --bubble-you: #f0ebe2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "Noto Sans KR", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(77, 124, 95, 0.12), transparent 28%),
                linear-gradient(180deg, #f8f3ea 0%, var(--bg) 100%);
            color: var(--text);
        }

        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        .hero {
            margin-bottom: 20px;
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
        }

        .layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 22px;
            box-shadow: 0 16px 40px rgba(69, 56, 38, 0.08);
            overflow: hidden;
        }

        .section {
            padding: 18px;
            border-bottom: 1px solid var(--line);
        }

        .section:last-child {
            border-bottom: 0;
        }

        .section h2 {
            margin: 0 0 12px;
            font-size: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--muted);
        }

        input,
        textarea,
        button {
            font: inherit;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 11px 13px;
            background: #fff;
            color: var(--text);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .field {
            margin-bottom: 12px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row > * {
            flex: 1;
        }

        button {
            border: 0;
            border-radius: 14px;
            padding: 11px 14px;
            cursor: pointer;
            background: var(--accent);
            color: white;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        button:hover {
            background: var(--accent-strong);
            transform: translateY(-1px);
        }

        button.secondary {
            background: #e9dfd0;
            color: var(--text);
        }

        button.secondary:hover {
            background: #ddd1bf;
        }

        .status {
            padding: 12px 14px;
            border-radius: 14px;
            background: #efe7d8;
            color: var(--text);
            font-size: 14px;
        }

        .rooms {
            display: grid;
            gap: 10px;
            max-height: 280px;
            overflow: auto;
        }

        .room {
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 12px;
            background: #fff;
            cursor: pointer;
        }

        .room.active {
            border-color: var(--accent);
            background: #f0f7f3;
        }

        .room-title {
            font-weight: 700;
            margin-bottom: 6px;
        }

        .room-meta {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.5;
        }

        .chat-shell {
            display: grid;
            grid-template-rows: auto 1fr auto;
            min-height: 720px;
        }

        .chat-head {
            padding: 20px;
            border-bottom: 1px solid var(--line);
        }

        .chat-head h2 {
            margin: 0 0 6px;
            font-size: 22px;
        }

        .chat-head p {
            margin: 0;
            color: var(--muted);
        }

        .typing {
            margin-top: 10px;
            min-height: 20px;
            font-size: 13px;
            color: var(--accent-strong);
        }

        .messages {
            padding: 20px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.2), transparent 30%),
                repeating-linear-gradient(
                    180deg,
                    rgba(122, 108, 83, 0.04) 0,
                    rgba(122, 108, 83, 0.04) 1px,
                    transparent 1px,
                    transparent 28px
                );
        }

        .message {
            max-width: 72%;
            border-radius: 18px;
            padding: 12px 14px;
            line-height: 1.45;
            position: relative;
        }

        .message.me {
            align-self: flex-end;
            background: var(--bubble-me);
        }

        .message.you {
            align-self: flex-start;
            background: var(--bubble-you);
        }

        .message .meta {
            margin-top: 6px;
            font-size: 11px;
            color: var(--muted);
        }

        .composer {
            border-top: 1px solid var(--line);
            padding: 18px;
            background: rgba(255, 253, 248, 0.94);
            backdrop-filter: blur(6px);
        }

        .log {
            max-height: 220px;
            overflow: auto;
            font-family: Consolas, monospace;
            font-size: 12px;
            background: #201d19;
            color: #f8f2e8;
            border-radius: 16px;
            padding: 14px;
            white-space: pre-wrap;
        }

        @media (max-width: 920px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .chat-shell {
                min-height: 620px;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="hero">
        <h1>공고 채팅 테스트</h1>
        <p>`test-token`이나 실제 Firebase 토큰으로 REST + WebSocket DM, 입력 중 이벤트를 한 화면에서 확인합니다.</p>
    </div>

    <div class="layout">
        <div class="card">
            <div class="section">
                <h2>연결 정보</h2>
                <div class="field">
                    <label for="token">Authorization Token</label>
                    <input id="token" value="test-token" />
                </div>
                <div class="row">
                    <button id="connectBtn">웹소켓 연결</button>
                    <button id="disconnectBtn" class="secondary">연결 종료</button>
                </div>
            </div>

            <div class="section">
                <h2>공고 방 열기</h2>
                <div class="field">
                    <label for="noticeId">Notice ID</label>
                    <input id="noticeId" placeholder="실종 공고 UUID" />
                </div>
                <div class="row">
                    <button id="createRoomBtn">방 생성/조회</button>
                    <button id="loadRoomsBtn" class="secondary">내 방 목록</button>
                </div>
            </div>

            <div class="section">
                <h2>현재 상태</h2>
                <div id="statusBox" class="status">웹소켓 미연결</div>
            </div>

            <div class="section">
                <h2>채팅방 목록</h2>
                <div id="rooms" class="rooms"></div>
            </div>

            <div class="section">
                <h2>디버그 로그</h2>
                <div id="log" class="log"></div>
            </div>
        </div>

        <div class="card chat-shell">
            <div class="chat-head">
                <h2 id="roomTitle">채팅방을 선택해 주세요</h2>
                <p id="roomMeta">공고 기반 1:1 DM</p>
                <div id="typingText" class="typing"></div>
            </div>

            <div id="messages" class="messages"></div>

            <div class="composer">
                <div class="field">
                    <label for="messageInput">메시지</label>
                    <textarea id="messageInput" placeholder="메시지를 입력해 보세요. 입력 중 이벤트도 함께 전송됩니다."></textarea>
                </div>
                <div class="row">
                    <button id="sendBtn">메시지 보내기</button>
                    <button id="refreshMessagesBtn" class="secondary">메시지 새로고침</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>
<script>
    const tokenInput = document.getElementById("token");
    const noticeIdInput = document.getElementById("noticeId");
    const statusBox = document.getElementById("statusBox");
    const roomsBox = document.getElementById("rooms");
    const messagesBox = document.getElementById("messages");
    const roomTitle = document.getElementById("roomTitle");
    const roomMeta = document.getElementById("roomMeta");
    const typingText = document.getElementById("typingText");
    const logBox = document.getElementById("log");
    const messageInput = document.getElementById("messageInput");

    let stompClient = null;
    let currentRoomId = null;
    let currentRoom = null;
    let roomSubscription = null;
    let typingSubscription = null;
    let typingTimer = null;
    let typingSent = false;
    let lastMessages = [];

    function log(message, payload) {
        const line = `[${new Date().toLocaleTimeString()}] ${message}`;
        logBox.textContent += payload ? `${line}\n${JSON.stringify(payload, null, 2)}\n\n` : `${line}\n`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function setStatus(text) {
        statusBox.textContent = text;
    }

    function authHeaders() {
        return {
            Authorization: `Bearer ${tokenInput.value.trim()}`
        };
    }

    async function api(path, options = {}) {
        const headers = {
            ...authHeaders(),
            ...(options.body ? {"Content-Type": "application/json"} : {}),
            ...(options.headers || {})
        };
        const response = await fetch(path, {
            method: options.method || "GET",
            headers,
            body: options.body ? JSON.stringify(options.body) : undefined
        });
        const json = await response.json();
        if (!response.ok || json.success === false) {
            throw new Error(json?.error?.message || json?.message || "요청 실패");
        }
        return json.data;
    }

    function connectWebSocket() {
        if (stompClient?.connected) {
            setStatus("이미 연결됨");
            return;
        }

        stompClient = new StompJs.Client({
            brokerURL: `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/chat`,
            connectHeaders: authHeaders(),
            reconnectDelay: 3000,
            debug: (str) => log(`STOMP ${str}`),
            onConnect: () => {
                setStatus("웹소켓 연결됨");
                log("웹소켓 연결 성공");
            },
            onStompError: (frame) => {
                setStatus("웹소켓 오류");
                log("STOMP 오류", frame.headers);
            },
            onWebSocketError: (event) => {
                setStatus("웹소켓 에러");
                log("웹소켓 에러", event);
            }
        });

        stompClient.activate();
    }

    function disconnectWebSocket() {
        roomSubscription?.unsubscribe();
        typingSubscription?.unsubscribe();
        roomSubscription = null;
        typingSubscription = null;
        stompClient?.deactivate();
        stompClient = null;
        setStatus("웹소켓 미연결");
        log("웹소켓 연결 종료");
    }

    function renderRooms(rooms) {
        roomsBox.innerHTML = "";
        if (!rooms.length) {
            roomsBox.innerHTML = "<div class='room-meta'>참여 중인 채팅방이 없습니다.</div>";
            return;
        }

        rooms.forEach((room) => {
            const div = document.createElement("div");
            div.className = `room${room.roomId === currentRoomId ? " active" : ""}`;
            div.innerHTML = `
                <div class="room-title">${escapeHtml(room.noticeTitle)}</div>
                <div class="room-meta">
                    roomId: ${room.roomId}<br>
                    상대: ${escapeHtml(room.opponentNickname)}<br>
                    안 읽은 메시지: ${room.unreadCount}<br>
                    상태: ${room.roomStatus}
                </div>
            `;
            div.addEventListener("click", () => openRoom(room));
            roomsBox.appendChild(div);
        });
    }

    async function loadRooms() {
        try {
            const rooms = await api("/api/chat/rooms");
            renderRooms(rooms);
            log("채팅방 목록 조회", rooms);
        } catch (error) {
            log(`채팅방 목록 조회 실패: ${error.message}`);
        }
    }

    async function createOrGetRoom() {
        if (!noticeIdInput.value.trim()) {
            alert("Notice ID를 입력해 주세요.");
            return;
        }

        try {
            const room = await api(`/api/chat/rooms/notice/${noticeIdInput.value.trim()}`, {method: "POST"});
            log("채팅방 생성/조회 성공", room);
            await loadRooms();
            await openRoom(room);
        } catch (error) {
            log(`채팅방 생성/조회 실패: ${error.message}`);
            alert(error.message);
        }
    }

    async function openRoom(room) {
        currentRoomId = room.roomId;
        currentRoom = room;
        roomTitle.textContent = room.noticeTitle;
        roomMeta.textContent = `roomId: ${room.roomId} / 상대: ${room.opponentNickname}`;
        typingText.textContent = "";
        await loadMessages(room.roomId);
        subscribeRoom(room.roomId);
        await loadRooms();
    }

    async function loadMessages(roomId = currentRoomId) {
        if (!roomId) {
            return;
        }

        try {
            const messages = await api(`/api/chat/rooms/${roomId}/messages`);
            lastMessages = messages;
            renderMessages(messages);
            log("메시지 목록 조회", messages);
        } catch (error) {
            log(`메시지 목록 조회 실패: ${error.message}`);
        }
    }

    function renderMessages(messages) {
        messagesBox.innerHTML = "";
        if (!messages.length) {
            messagesBox.innerHTML = "<div class='room-meta'>아직 메시지가 없습니다.</div>";
            return;
        }

        messages.forEach((message) => {
            const div = document.createElement("div");
            div.className = `message ${message.mine ? "me" : "you"}`;
            div.innerHTML = `
                <div>${escapeHtml(message.message)}</div>
                <div class="meta">${escapeHtml(message.senderNickname)} · ${formatDate(message.createdAt)}</div>
            `;
            messagesBox.appendChild(div);
        });

        messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    function subscribeRoom(roomId) {
        if (!stompClient?.connected) {
            log("웹소켓 연결 후 구독해 주세요.");
            return;
        }

        roomSubscription?.unsubscribe();
        typingSubscription?.unsubscribe();

        roomSubscription = stompClient.subscribe(`/topic/chat/rooms/${roomId}`, (frame) => {
            const payload = JSON.parse(frame.body);
            log("실시간 메시지 수신", payload);
            if (payload.roomId === currentRoomId) {
                lastMessages.push(payload);
                renderMessages(lastMessages);
            }
        });

        typingSubscription = stompClient.subscribe(`/topic/chat/rooms/${roomId}/typing`, (frame) => {
            const payload = JSON.parse(frame.body);
            log("typing 이벤트 수신", payload);
            typingText.textContent = payload.isTyping ? `${payload.senderNickname} 님이 입력 중입니다...` : "";
            if (payload.isTyping) {
                clearTimeout(typingTimer);
                typingTimer = setTimeout(() => {
                    typingText.textContent = "";
                }, 2500);
            }
        });
    }

    function sendMessage() {
        if (!stompClient?.connected) {
            alert("먼저 웹소켓을 연결해 주세요.");
            return;
        }
        if (!currentRoomId) {
            alert("먼저 채팅방을 선택해 주세요.");
            return;
        }
        const message = messageInput.value.trim();
        if (!message) {
            return;
        }

        stompClient.publish({
            destination: "/app/chat/send",
            body: JSON.stringify({
                roomId: currentRoomId,
                message
            })
        });

        messageInput.value = "";
        sendTyping(false);
    }

    function sendTyping(isTyping) {
        if (!stompClient?.connected || !currentRoomId) {
            return;
        }

        stompClient.publish({
            destination: "/app/chat/typing",
            body: JSON.stringify({
                roomId: currentRoomId,
                typing: isTyping
            })
        });

        typingSent = isTyping;
    }

    function handleTypingInput() {
        if (!currentRoomId || !stompClient?.connected) {
            return;
        }

        if (!typingSent) {
            sendTyping(true);
        }

        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
            sendTyping(false);
        }, 1200);
    }

    function formatDate(value) {
        if (!value) {
            return "-";
        }
        return new Date(value).toLocaleString();
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll("\"", "&quot;")
            .replaceAll("'", "&#039;");
    }

    document.getElementById("connectBtn").addEventListener("click", connectWebSocket);
    document.getElementById("disconnectBtn").addEventListener("click", disconnectWebSocket);
    document.getElementById("createRoomBtn").addEventListener("click", createOrGetRoom);
    document.getElementById("loadRoomsBtn").addEventListener("click", loadRooms);
    document.getElementById("refreshMessagesBtn").addEventListener("click", () => loadMessages());
    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    messageInput.addEventListener("input", handleTypingInput);
    messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });

    log("테스트 페이지 준비 완료");
</script>
</body>
</html>
