<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pogun Notification Flow</title>
  <style>
    :root { --bg:#f6f1e8; --card:#fffaf0; --ink:#1f2933; --muted:#6b7280; --line:#dac9b2; --accent:#c05f2c; --good:#1f8a4c; --bad:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); }
    main { width:min(960px,calc(100% - 28px)); margin:20px auto 32px; display:grid; gap:14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:0 10px 26px rgba(31,41,51,.06); }
    h1,h2,p { margin:0; }
    .page-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .status { min-height:40px; padding:10px 12px; border-radius:12px; background:rgba(31,41,51,.06); color:var(--muted); font-size:13px; font-weight:700; overflow-wrap:anywhere; }
    .status.good { background:rgba(31,138,76,.12); color:var(--good); }
    .status.bad { background:rgba(180,35,24,.10); color:var(--bad); }
    .muted { color:var(--muted); font-size:12px; line-height:1.5; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    button, a.nav-link { border:0; border-radius:8px; padding:11px 14px; font:inherit; font-weight:800; cursor:pointer; }
    button { color:#fff; background:var(--accent); }
    button.secondary, a.nav-link { background:rgba(31,41,51,.10); color:var(--ink); text-decoration:none; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .summary-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:10px; }
    .summary-item { border:1px solid rgba(31,41,51,.10); border-radius:10px; padding:12px; background:#fffdf7; }
    .summary-item span { display:block; color:var(--muted); font-size:12px; font-weight:800; margin-bottom:4px; }
    .summary-item strong { display:block; font-size:20px; }
    .list { display:grid; gap:10px; margin-top:10px; }
    .item { border:1px solid rgba(31,41,51,.12); border-radius:12px; padding:12px; background:#fffdf7; }
    .item.unread { border-color:rgba(192,95,44,.28); box-shadow:0 0 0 2px rgba(192,95,44,.10); }
    .item-top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .item-top strong { font-size:15px; line-height:1.35; }
    .item-top small { color:var(--muted); font-size:12px; font-weight:800; }
    .item-body { margin-top:8px; color:var(--ink); font-size:14px; line-height:1.55; }
    .item-meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .pill { display:inline-flex; align-items:center; padding:4px 8px; border-radius:999px; background:rgba(31,41,51,.08); color:var(--muted); font-size:11px; font-weight:800; }
    .pill.unread { background:rgba(192,95,44,.12); color:var(--accent); }
    .meta-link { display:inline-flex; align-items:center; padding:4px 8px; border-radius:999px; background:rgba(192,95,44,.12); color:var(--accent); font-size:11px; font-weight:900; text-decoration:none; }
    .empty { padding:28px 0; text-align:center; color:var(--muted); font-size:13px; }
    @media (max-width:640px){
      html,body{width:100%;max-width:100%;overflow-x:hidden;}
      main{width:100%;max-width:100%;margin:0;padding:10px;gap:10px;}
      .card{width:100%;min-width:0;border-radius:12px;padding:14px;box-shadow:0 6px 18px rgba(31,41,51,.06);}
      .page-head{display:grid;gap:10px;}
      .summary-grid{grid-template-columns:1fr;}
      .actions{display:grid;grid-template-columns:1fr;gap:7px;}
      button,a.nav-link{width:100%;text-align:center;}
      .item-top{display:grid;gap:6px;}
    }
  </style>
</head>
<body>
<main>
  <section class="card">
    <div class="page-head">
      <div>
        <h1>Notification Flow</h1>
        <p class="muted" style="margin-top:6px">기존 알림 API로 목록, 읽음 처리, unread count를 확인합니다.</p>
      </div>
      <div id="notificationBellMount"></div>
    </div>
    <div id="status" class="status" style="margin-top:10px">준비 중</div>
  </section>

  <section class="card">
    <h2>로그인 세션</h2>
    <p id="accountHint" class="muted" style="margin-top:8px">login-flow.html에서 로그인 후 진입해 주세요.</p>
    <div class="actions">
      <a class="nav-link" href="/login-flow.html?redirect=/notification-flow.html">Login Flow로 이동</a>
      <a class="nav-link" href="/notice-flow.html">Notice Flow</a>
      <a class="nav-link" href="/dm-flow.html">DM Flow</a>
    </div>
  </section>

  <section class="card">
    <h2>알림 요약</h2>
    <div class="summary-grid">
      <div class="summary-item">
        <span>읽지 않은 알림</span>
        <strong id="unreadCountValue">-</strong>
      </div>
      <div class="summary-item">
        <span>마지막 새로고침</span>
        <strong id="lastRefreshValue">-</strong>
      </div>
    </div>
    <div class="actions">
      <button id="refreshNotificationsButton" type="button">새로고침</button>
      <button id="readAllNotificationsButton" type="button" class="secondary">전체 읽음 처리</button>
    </div>
  </section>

  <section class="card">
    <h2>알림 목록</h2>
    <div id="notificationList" class="list">
      <div class="empty">로그인 후 알림을 확인할 수 있습니다.</div>
    </div>
  </section>
</main>

<script type="module">
import {
  fetchNotifications,
  fetchUnreadCount,
  formatDateTime,
  getStoredSession,
  markAllNotificationsRead,
  markNotificationRead,
  mountNotificationBell,
  refreshNotificationBell
} from "./notification-web.js";

const el = (id) => document.getElementById(id);

function setStatus(message, tone = "") {
  const node = el("status");
  node.textContent = message;
  node.className = `status${tone ? ` ${tone}` : ""}`;
}

function renderSession() {
  const session = getStoredSession();
  el("accountHint").textContent = session?.firebaseIdToken
    ? `${session.nickname || session.email || "Google 사용자"} 로그인됨 · ${session.email || "-"}${session.userId ? ` · ${session.userId}` : ""}`
    : "login-flow.html에서 로그인 후 진입해 주세요.";
  el("readAllNotificationsButton").disabled = !session?.userId;
}

function renderNotifications(items) {
  const list = el("notificationList");
  if (!Array.isArray(items) || items.length === 0) {
    list.innerHTML = '<div class="empty">표시할 알림이 없습니다.</div>';
    return;
  }
  list.innerHTML = items.map((item) => `
    <article class="item ${item.isRead ? "" : "unread"}" data-id="${item.id}">
      <div class="item-top">
        <div>
          <strong>${escapeHtml(item.title || "제목 없음")}</strong>
          <small>${escapeHtml(formatDateTime(item.createdAt))}</small>
        </div>
        ${item.isRead ? '<span class="pill">읽음</span>' : '<span class="pill unread">안읽음</span>'}
      </div>
      <div class="item-body">${escapeHtml(item.body || "")}</div>
      <div class="item-meta">
        <span class="pill">${escapeHtml(item.type || "-")}</span>
        <span class="pill">${escapeHtml(item.targetType || "-")}</span>
        <span class="pill">${escapeHtml(item.priority || "-")}</span>
        ${renderRoomMeta(item)}
      </div>
      <div class="actions">
        <button type="button" class="secondary mark-read-button" ${item.isRead ? "disabled" : ""}>읽음 처리</button>
      </div>
    </article>
  `).join("");

  list.querySelectorAll(".mark-read-button").forEach((button) => {
    button.addEventListener("click", async () => {
      const article = button.closest(".item");
      const notificationId = article?.dataset.id;
      if (!notificationId) {
        return;
      }
      try {
        await markNotificationRead(notificationId);
        setStatus("알림 읽음 처리 완료", "good");
        await refreshAll();
      } catch (error) {
        setStatus(error.message || String(error), "bad");
      }
    });
  });
}

function renderRoomMeta(item) {
  const roomId = item?.metadata?.roomId;
  if (!roomId) {
    return "";
  }
  const shortRoomId = roomId.length > 8 ? roomId.slice(0, 8) : roomId;
  return `<span class="pill">DM 방 ${escapeHtml(shortRoomId)}</span>
          <a class="meta-link" href="/dm-flow.html?roomId=${encodeURIComponent(roomId)}">방 열기</a>`;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

async function refreshAll() {
  renderSession();
  const session = getStoredSession();
  await refreshNotificationBell("notificationBellMount");
  if (!session?.userId) {
    el("unreadCountValue").textContent = "-";
    el("lastRefreshValue").textContent = formatDateTime(new Date().toISOString());
    renderNotifications([]);
    setStatus("온보딩 완료 후 알림 목록을 확인할 수 있습니다.");
    return;
  }

  setStatus("알림 목록을 불러오는 중...");
  const [unreadCount, notificationPage] = await Promise.all([
    fetchUnreadCount(),
    fetchNotifications(0, 20)
  ]);
  el("unreadCountValue").textContent = String(unreadCount);
  el("lastRefreshValue").textContent = formatDateTime(new Date().toISOString());
  renderNotifications(notificationPage?.items || []);
  setStatus("알림 목록을 불러왔습니다.", "good");
}

mountNotificationBell("notificationBellMount");
el("refreshNotificationsButton").addEventListener("click", () => {
  refreshAll().catch((error) => setStatus(error.message || String(error), "bad"));
});
el("readAllNotificationsButton").addEventListener("click", async () => {
  try {
    await markAllNotificationsRead();
    setStatus("전체 알림을 읽음 처리했습니다.", "good");
    await refreshAll();
  } catch (error) {
    setStatus(error.message || String(error), "bad");
  }
});

window.addEventListener("focus", () => refreshAll().catch(() => {}));
window.addEventListener("notification-web:message", () => refreshAll().catch(() => {}));

refreshAll().catch((error) => setStatus(error.message || String(error), "bad"));
</script>
</body>
</html>
