<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pogun Full Compact</title>
  <style>
    :root { --bg:#0b0b0c; --panel:#151515; --line:#2f2f32; --ink:#f6f6f3; --muted:#a7a7aa; --active:#e9e9e6; --active-ink:#0a0a0a; --danger:#ef7777; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Pretendard","Noto Sans KR","Segoe UI","Malgun Gothic",sans-serif; letter-spacing:-.02em; background:var(--bg); color:var(--ink); overflow:hidden; }
    body.menu-open { overflow:hidden; }
    .app { display:grid; grid-template-columns:320px minmax(0,1fr); min-height:100vh; min-width:0; }
    .brand { height:64px; position:relative; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 18px 0 30px; border-bottom:1px solid var(--line); font-size:24px; font-weight:900; }
    .top { height:64px; border-bottom:1px solid var(--line); background:var(--bg); position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:0 18px; }
    .top-left { display:flex; align-items:center; gap:10px; min-width:0; }
    .top-title { font-size:14px; font-weight:700; color:#d5d5d7; letter-spacing:0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .top-actions { display:flex; align-items:center; gap:8px; }
    .refresh-btn { width:38px; height:38px; border:1px solid var(--line); border-radius:10px; background:#1a1a1d; color:var(--ink); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .2s ease; }
    .refresh-btn:hover { border-color:#fff; background:#232327; }
    .refresh-icon { width:18px; height:18px; display:block; }
    .refresh-btn.spinning .refresh-icon { animation:spin .7s linear infinite; }
    @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
    .hamburger { width:40px; height:36px; border:1px solid var(--line); border-radius:8px; background:#202020; color:var(--ink); font-size:18px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; position:relative; z-index:55; cursor:pointer; }
    .top-menu-btn { display:none; }
    .mobile-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.44); z-index:28; }
    .shell-side { background:#151515; border-right:1px solid var(--line); }
    .layout { min-height:100vh; display:grid; grid-template-rows:64px minmax(0,1fr); min-width:0; }
    .side { padding:20px 14px; display:grid; gap:8px; align-content:start; }
    .nav-group { margin:0 0 12px; color:#cfcfd2; font-size:15px; font-weight:800; }
    .side button { width:100%; min-width:0; min-height:48px; display:flex; align-items:center; text-align:left; border:1px solid transparent; border-radius:10px; background:transparent; color:#c6c6c9; padding:0 18px; font-size:19px; font-weight:700; cursor:pointer; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .side button .label { min-width:0; overflow:hidden; text-overflow:ellipsis; }
    .side button.active { border-color:#fff; background:var(--active); color:var(--active-ink); }
    .content { min-width:0; min-height:0; background:var(--bg); overflow:hidden; }
    .frame-wrap { display:none; height:100%; min-width:0; overflow:hidden; background:var(--bg); }
    .frame-wrap.active { display:block; }
    iframe { width:100%; min-width:0; height:calc(100vh - 64px); border:0; background:var(--bg); overflow:auto; }
    body.sidebar-collapsed .app { grid-template-columns:56px minmax(0,1fr); }
    body.sidebar-collapsed .brand { justify-content:center; padding:0; font-size:0; }
    body.sidebar-collapsed .hamburger { position:absolute; left:50%; top:50%; width:38px; height:36px; transform:translate(-50%,-50%); }
    body.sidebar-collapsed .brand::before { content:""; }
    body.sidebar-collapsed .side { padding:20px 10px; }
    body.sidebar-collapsed .nav-group { display:none; }
    body.sidebar-collapsed .side button { display:none; }
    @media (max-width:1024px) {
      body { overflow:auto; }
      .app { grid-template-columns:1fr; }
      .shell-side { position:fixed; inset:0 auto 0 0; width:300px; z-index:30; transform:translateX(-105%); transition:transform .2s ease; }
      body.menu-open .shell-side { transform:translateX(0); }
      body.menu-open .mobile-backdrop { display:block; }
      iframe { height:calc(100dvh - 64px); }
      body.sidebar-collapsed .app { grid-template-columns:1fr; }
      body.sidebar-collapsed .side button { display:flex; }
      body.sidebar-collapsed .nav-group { display:block; }
      .top-menu-btn { display:inline-flex; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="shell-side">
      <div class="brand"><span>Pogun Admin</span><button id="menuBtn" class="hamburger" aria-label="menu">☰</button></div>
      <nav class="side" id="sideNav">
        <div class="nav-group">개요</div>
        <button data-view="login" data-short="L" aria-label="Login"><span class="label">Login</span></button>
        <div class="nav-group">운영</div>
        <button data-view="notice" data-short="N" aria-label="Notice"><span class="label">실종 공고</span></button>
        <button data-view="community" data-short="C" aria-label="Community"><span class="label">커뮤니티</span></button>
        <button data-view="shelter" data-short="S" aria-label="Shelter"><span class="label">보호소 공고</span></button>
        <button data-view="dm" data-short="D" aria-label="DM"><span class="label">DM</span></button>
        <div class="nav-group">시스템 & 로그</div>
        <button data-view="admin" data-short="A" aria-label="Admin"><span class="label">관리자 승격</span></button>
        <button data-view="notification" data-short="F" aria-label="Notification"><span class="label">알림</span></button>
        <button data-view="setting" data-short="G" aria-label="Setting"><span class="label">설정</span></button>
      </nav>
    </aside>
    <button id="menuBackdrop" class="mobile-backdrop" aria-label="menu backdrop"></button>

    <div class="layout">
      <header class="top">
        <div class="top-left">
          <button id="topMenuBtn" class="hamburger top-menu-btn" aria-label="menu">☰</button>
          <span class="top-title" id="topTitle">admin</span>
        </div>
        <div class="top-actions">
          <button id="refreshBtn" class="refresh-btn" aria-label="refresh" title="현재 섹션 새로고침">
            <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 2v6h-6"></path>
              <path d="M20.49 15a9 9 0 1 1 .12-5"></path>
            </svg>
          </button>
        </div>
      </header>

      <main class="content">
      <section id="view-login" class="frame-wrap active">
        <iframe data-view-frame="login" data-src="/full_compact/pages/login-flow.html" src="about:blank" title="login"></iframe>
      </section>
      <section id="view-notice" class="frame-wrap">
        <iframe data-view-frame="notice" data-src="/full_compact/pages/notice-flow.html" src="about:blank" title="notice"></iframe>
      </section>
      <section id="view-community" class="frame-wrap">
        <iframe data-view-frame="community" data-src="/full_compact/pages/community-flow.html" src="about:blank" title="community"></iframe>
      </section>
      <section id="view-dm" class="frame-wrap">
        <iframe data-view-frame="dm" data-src="/full_compact/pages/dm-flow.html" src="about:blank" title="dm"></iframe>
      </section>
      <section id="view-admin" class="frame-wrap">
        <iframe data-view-frame="admin" data-src="/admin-email-promote.html" src="about:blank" title="admin"></iframe>
      </section>
      <section id="view-notification" class="frame-wrap">
        <iframe data-view-frame="notification" data-src="/full_compact/pages/notification-flow.html" src="about:blank" title="notification"></iframe>
      </section>
      <section id="view-setting" class="frame-wrap">
        <iframe data-view-frame="setting" data-src="/full_compact/pages/setting-flow.html" src="about:blank" title="setting"></iframe>
      </section>
      <section id="view-shelter" class="frame-wrap">
        <iframe data-view-frame="shelter" data-src="/full_compact/pages/shelter-flow.html" src="about:blank" title="shelter"></iframe>
      </section>
      </main>
    </div>
  </div>

  <script>
    const btn = document.getElementById("menuBtn");
    const topMenuBtn = document.getElementById("topMenuBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const topTitle = document.getElementById("topTitle");
    const backdrop = document.getElementById("menuBackdrop");
    const navButtons = [...document.querySelectorAll("#sideNav button[data-view]")];
    const PENDING_VIEW_KEY = "pogun-full-compact-pending-view";
    const VIEWS = ["login","notice","community","dm","admin","notification","setting","shelter"];
    const query = new URLSearchParams(window.location.search);
    const backendBaseOverride = (query.get("backendBase") || query.get("apiBase") || "").trim();
    if (backendBaseOverride) {
      document.querySelectorAll("iframe[data-view-frame]").forEach((frame) => {
        try {
          const basePath = frame.getAttribute("data-src") || frame.getAttribute("src");
          const url = new URL(basePath, window.location.origin);
          url.searchParams.set("backendBase", backendBaseOverride);
          frame.setAttribute("data-src", url.pathname + "?" + url.searchParams.toString());
        } catch {}
      });
    }
    const normalizeView = (view) => VIEWS.includes(view) ? view : null;
    const currentActiveView = () => {
      const active = document.querySelector("#sideNav button.active");
      return normalizeView(active?.dataset?.view) || "login";
    };
    const spinRefresh = (ms = 700) => {
      refreshBtn.classList.add("spinning");
      window.setTimeout(() => refreshBtn.classList.remove("spinning"), ms);
    };
    const loadedFrames = new Set();
    const baseFrameSrc = (frame) => frame?.getAttribute("data-src") || "";
    const ensureViewLoaded = (view) => {
      const frame = document.querySelector(`iframe[data-view-frame="${view}"]`);
      if (!frame) return null;
      const src = baseFrameSrc(frame);
      if (!src) return frame;
      if (!loadedFrames.has(view) || frame.getAttribute("src") === "about:blank") {
        frame.setAttribute("src", src);
        loadedFrames.add(view);
      }
      return frame;
    };
    const unloadInactiveViews = (activeView) => {
      document.querySelectorAll("iframe[data-view-frame]").forEach((frame) => {
        const view = frame.getAttribute("data-view-frame");
        if (!view || view === activeView) return;
        if (frame.getAttribute("src") !== "about:blank") {
          frame.setAttribute("src", "about:blank");
        }
        loadedFrames.delete(view);
      });
    };
    const refreshView = (view) => {
      const targetView = normalizeView(view) || currentActiveView();
      const frame = ensureViewLoaded(targetView);
      if (!frame) return;
      spinRefresh();
      try {
        const basePath = baseFrameSrc(frame);
        const url = new URL(basePath || frame.getAttribute("src"), window.location.origin);
        url.searchParams.set("_refresh", String(Date.now()));
        frame.setAttribute("src", url.pathname + (url.search ? url.search : ""));
        loadedFrames.add(targetView);
      } catch {
        frame.src = frame.src;
      }
    };
    const activate = (view, options = {}) => {
      const safeView = normalizeView(view) || "login";
      navButtons.forEach((b) => b.classList.toggle("active", b.dataset.view === safeView));
      VIEWS.forEach((k) => {
        document.getElementById(`view-${k}`).classList.toggle("active", k === safeView);
      });
      topTitle.textContent = safeView;
      ensureViewLoaded(safeView);
      unloadInactiveViews(safeView);
      if (window.matchMedia("(max-width:1024px)").matches) document.body.classList.remove("menu-open");
      if (options.refresh !== false) {
        refreshView(safeView);
      }
    };
    const toggleMenu = () => {
      if (window.matchMedia("(max-width:1024px)").matches) document.body.classList.toggle("menu-open");
      else document.body.classList.toggle("sidebar-collapsed");
    };
    btn.addEventListener("click", toggleMenu);
    topMenuBtn.addEventListener("click", toggleMenu);
    navButtons.forEach((b) => b.addEventListener("click", () => activate(b.dataset.view, { refresh: false })));
    refreshBtn.addEventListener("click", () => refreshView(currentActiveView()));
    backdrop.addEventListener("click", () => document.body.classList.remove("menu-open"));
    window.addEventListener("message", (event) => {
      if (event.origin !== window.location.origin) return;
      const data = event.data || {};
      if (data.type === "pogun-auth-required") {
        try { window.sessionStorage.setItem(PENDING_VIEW_KEY, normalizeView(data.view) || currentActiveView()); } catch {}
        activate("login", { refresh: false });
      }
      if (data.type === "pogun-open-view") {
        const targetView = normalizeView(data.view) || (() => {
          try { return normalizeView(window.sessionStorage.getItem(PENDING_VIEW_KEY)) || currentActiveView(); } catch { return currentActiveView(); }
        })();
        try { window.sessionStorage.removeItem(PENDING_VIEW_KEY); } catch {}
        activate(targetView, { refresh: false });
      }
    });
    const initialView = normalizeView(query.get("view")) || "login";
    activate(initialView, { refresh: false });
  </script>
</body>
</html>
