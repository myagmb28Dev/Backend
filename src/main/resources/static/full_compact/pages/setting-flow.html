<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/js/page-embed-guard.js"></script>
  <title>Pogun Setting Console</title>
  <style>
    :root { --bg:#0f0b14; --card:#171220; --ink:#f5f3ff; --muted:#a59bb9; --line:#2d2540; --accent:#8b5cf6; --good:#34d399; --bad:#f87171; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); }
    main { width:min(980px,calc(100% - 28px)); margin:20px auto; display:grid; gap:14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
    h1,h2,p { margin:0; }
    .status { min-height:40px; padding:10px 12px; border-radius:8px; background:#1f1930; border:1px solid var(--line); color:var(--muted); font-size:13px; font-weight:700; }
    .status.good { background:rgba(31,138,76,.12); color:var(--good); }
    .status.bad { background:rgba(180,35,24,.10); color:var(--bad); }
    .muted { color:var(--muted); font-size:12px; margin-top:8px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    label { display:grid; gap:5px; color:var(--muted); font-size:12px; font-weight:800; margin-top:10px; }
    input, select { width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 11px; background:#130f1d; color:var(--ink); font:inherit; font-weight:600; }
    button { border:1px solid #6d46c6; border-radius:8px; padding:10px 12px; font-weight:700; cursor:pointer; color:#fff; background:var(--accent); }
    button.secondary { background:#1f1930; color:var(--ink); border:1px solid var(--line); }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .line { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px; border:1px solid var(--line); border-radius:10px; margin-top:8px; background:#1b1528; }
    .line strong { font-size:13px; }
    .line small { color:var(--muted); font-size:11px; }
    .table-wrap { margin-top:10px; border:1px solid var(--line); border-radius:10px; overflow:auto; }
    table { width:100%; border-collapse:collapse; min-width:620px; }
    th, td { padding:10px 12px; border-bottom:1px solid #2a2a2f; font-size:12px; text-align:left; white-space:nowrap; }
    th { color:#d4d4d8; background:#1f1f23; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:800; }
    .pill.on { color:#34d399; background:rgba(52,211,153,.14); }
    .pill.off { color:#f87171; background:rgba(248,113,113,.16); }
    .profile-summary { display:grid; gap:4px; margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:12px; background:#1b1528; }
    .profile-summary strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
    .profile-summary small { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .profile-fields[hidden], .edit-only[hidden] { display:none !important; }
    @media (max-width:860px) { .grid { grid-template-columns:1fr; } }
  </style>
  <link rel="stylesheet" href="/full_compact/admin-theme.css">
</head>
<body>
<main>
  <section class="hero">
    <div>
      <strong>Setting Console</strong>
      <h1>내 계정 설정</h1>
      <p class="muted">현재 로그인 계정의 프로필, 상태, 알림 설정, 기기별 알림을 한 화면에서 조작합니다.</p>
    </div>
    <div id="notificationBellMount"></div>
  </section>

  <section class="card">
    <div id="status" class="status">준비 중</div>
    <p id="accountHint" class="muted">세션 확인 중입니다.</p>
  </section>

  <div class="grid">
    <section class="card">
      <h2>프로필</h2>
      <div class="profile-summary" aria-live="polite">
        <strong id="profilePreviewName">-</strong>
        <small id="profilePreviewSummary">프로필 정보 없음</small>
      </div>
      <div id="profileFields" class="profile-fields" hidden>
        <label>닉네임<input id="nicknameInput"></label>
        <label>전화번호<input id="phoneInput"></label>
        <label>지역<input id="regionInput"></label>
        <label>프로필 이미지 업로드<input id="profileImageFileInput" type="file" accept="image/*"></label>
      </div>
      <div class="actions">
        <button id="editProfileButton" class="secondary">프로필 수정</button>
        <button id="saveProfileButton" class="edit-only" hidden>프로필 저장</button>
        <button id="cancelProfileEditButton" class="secondary edit-only" hidden>취소</button>
      </div>
    </section>

    <section class="card">
      <h2>온라인 상태</h2>
      <label>수동 상태
        <select id="availabilitySelect">
          <option value="ONLINE">ONLINE</option>
          <option value="IDLE">IDLE</option>
          <option value="OFFLINE">OFFLINE</option>
        </select>
      </label>
      <div class="line">
        <div>
          <strong>실제 연결 상태</strong>
          <small id="actualConnectionState">-</small>
        </div>
        <span id="effectivePresencePill" class="pill">-</span>
      </div>
      <div class="actions">
        <button id="saveAvailabilityButton">상태 저장</button>
      </div>
    </section>
  </div>

  <section class="card">
    <h2>알림 타입 설정</h2>
    <div class="actions">
      <button id="enableAllNotificationTypesButton" class="secondary">전체 켜기</button>
      <button id="disableAllNotificationTypesButton" class="secondary">전체 끄기</button>
      <button id="saveNotificationSettingsButton">설정 저장</button>
    </div>
    <div id="notificationTypeList"></div>
  </section>

  <section class="card">
    <h2>기기별 알림 설정</h2>
    <p class="muted">현재 계정으로 등록된 디바이스 토큰별로 알림 수신을 켜고 끕니다.</p>
    <div id="deviceListWrap" class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Token ID</th>
            <th>Platform</th>
            <th>Device ID</th>
            <th>상태</th>
            <th>최근 접속</th>
            <th>작업</th>
          </tr>
        </thead>
        <tbody id="deviceRows"></tbody>
      </table>
    </div>
  </section>
</main>

<script type="module" src="/js/global-presence.js"></script>
<script type="module">
import {
  authRequest,
  formatDateTime,
  getStoredSession,
  mountNotificationBell,
  refreshNotificationBell
} from "/js/notification-web.js";
import { saveSession } from "/js/session-store.js";

const el = (id) => document.getElementById(id);
const REAL_SESSION_KEY = "pogun-real-firebase-session-v1";
let notificationSettings = [];
let profileEditMode = false;
let lastProfileData = null;

function setStatus(message, tone = "") {
  const node = el("status");
  node.textContent = message;
  node.className = `status${tone ? ` ${tone}` : ""}`;
}

function ensureSession() {
  const session = getStoredSession();
  if (!session?.firebaseIdToken) {
    throw new Error("로그인이 필요합니다. login-flow에서 먼저 로그인하세요.");
  }
  el("accountHint").textContent = `${session.nickname || session.email || "사용자"} · ${session.email || "-"}`;
  return session;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderProfileSummary() {
  const name = el("profilePreviewName");
  const summary = el("profilePreviewSummary");
  const nickname = el("nicknameInput").value.trim() || getStoredSession()?.nickname || "-";
  const phoneNumber = el("phoneInput").value.trim();
  const region = el("regionInput").value.trim();
  const selectedFileName = el("profileImageFileInput").files?.[0]?.name || "";

  name.textContent = nickname;
  summary.textContent = [region, phoneNumber, selectedFileName ? `선택된 이미지: ${selectedFileName}` : ""].filter(Boolean).join(" · ") || "프로필 정보 없음";
}

function syncStoredProfile(data) {
  const session = getStoredSession();
  if (!session || !data) {
    return;
  }
  saveSession(REAL_SESSION_KEY, {
    ...session,
    nickname: data.nickname || session.nickname || "",
    profileImageUrl: data.profileImageUrl || "",
    region: data.region || session.region || "",
    phoneNumber: data.phoneNumber || session.phoneNumber || ""
  });
}

function setProfileFields(data = {}) {
  el("nicknameInput").value = data?.nickname || "";
  el("phoneInput").value = data?.phoneNumber || "";
  el("regionInput").value = data?.region || "";
  el("profileImageFileInput").value = "";
}

function setProfileEditMode(enabled) {
  profileEditMode = !!enabled;
  el("profileFields").hidden = !profileEditMode;
  el("saveProfileButton").hidden = !profileEditMode;
  el("cancelProfileEditButton").hidden = !profileEditMode;
  el("editProfileButton").hidden = profileEditMode;
}

async function requestData(path, init = {}) {
  const response = await authRequest(path, init);
  if (response.status < 200 || response.status >= 300) {
    throw new Error(`${path} 실패: ${JSON.stringify(response.body)}`);
  }
  return response.body?.data;
}

async function loadProfile() {
  const data = await requestData("/api/users/me");
  lastProfileData = data || {};
  setProfileFields(lastProfileData);
  syncStoredProfile(data);
  renderProfileSummary();
  setProfileEditMode(false);
}

async function saveProfile() {
  const body = {
    nickname: el("nicknameInput").value.trim(),
    phoneNumber: el("phoneInput").value.trim(),
    region: el("regionInput").value.trim()
  };
  const profileImage = el("profileImageFileInput").files?.[0] || null;
  const init = profileImage ? buildMultipartProfileRequest(body, profileImage) : {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  };
  const data = await requestData("/api/users/me", init);
  lastProfileData = data || body;
  setProfileFields(lastProfileData);
  syncStoredProfile(data);
  renderProfileSummary();
  notifyParentProfileUpdated(data);
  setProfileEditMode(false);
}

function buildMultipartProfileRequest(body, profileImage) {
  const formData = new FormData();
  formData.append("request", new Blob([JSON.stringify(body)], { type: "application/json" }));
  formData.append("profileImage", profileImage);
  return {
    method: "PATCH",
    body: formData
  };
}

function notifyParentProfileUpdated(data) {
  if (!data || !window.parent || window.parent === window) {
    return;
  }
  window.parent.postMessage({ type: "pogun-profile-updated", profile: data }, window.location.origin);
}

function setPresencePill(value) {
  const pill = el("effectivePresencePill");
  const normalized = String(value || "").toUpperCase();
  pill.textContent = normalized || "-";
  pill.className = `pill ${normalized === "ONLINE" ? "on" : "off"}`;
}

async function loadAvailability() {
  const data = await requestData("/api/users/me/availability");
  const manual = (data?.manualPresenceStatus || data?.availabilityStatus || "ONLINE").toUpperCase();
  el("availabilitySelect").value = manual;
  el("actualConnectionState").textContent = data?.actualConnectionState || "-";
  setPresencePill(data?.effectivePresenceStatus || manual);
}

async function saveAvailability() {
  const availabilityStatus = el("availabilitySelect").value;
  const data = await requestData("/api/users/me/availability", {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ availabilityStatus })
  });
  el("actualConnectionState").textContent = data?.actualConnectionState || "-";
  setPresencePill(data?.effectivePresenceStatus || availabilityStatus);
}

function renderNotificationTypes() {
  const list = el("notificationTypeList");
  if (!notificationSettings.length) {
    list.innerHTML = '<p class="muted">설정 항목이 없습니다.</p>';
    return;
  }
  list.innerHTML = notificationSettings.map((item, idx) => `
    <label class="line">
      <div>
        <strong>${escapeHtml(item.type)}</strong>
        <small>${item.enabled ? "수신 중" : "차단됨"}</small>
      </div>
      <input data-setting-idx="${idx}" type="checkbox" ${item.enabled ? "checked" : ""} style="width:auto;">
    </label>
  `).join("");
  list.querySelectorAll("input[data-setting-idx]").forEach((input) => {
    input.addEventListener("change", () => {
      const idx = Number(input.dataset.settingIdx);
      if (!Number.isFinite(idx) || !notificationSettings[idx]) return;
      notificationSettings[idx].enabled = !!input.checked;
    });
  });
}

async function loadNotificationSettings() {
  const data = await requestData("/api/notifications/settings");
  notificationSettings = Array.isArray(data) ? data.map((item) => ({ type: item.type, enabled: !!item.enabled })) : [];
  renderNotificationTypes();
}

async function saveNotificationSettings() {
  const payload = {
    settings: notificationSettings.map((item) => ({
      type: item.type,
      enabled: !!item.enabled
    }))
  };
  const data = await requestData("/api/notifications/settings", {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  notificationSettings = Array.isArray(data) ? data.map((item) => ({ type: item.type, enabled: !!item.enabled })) : [];
  renderNotificationTypes();
}

function renderDevices(devices) {
  const tbody = el("deviceRows");
  if (!Array.isArray(devices) || !devices.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="muted">등록된 기기가 없습니다.</td></tr>';
    return;
  }
  tbody.innerHTML = devices.map((device) => `
    <tr>
      <td>${escapeHtml(device.id)}</td>
      <td>${escapeHtml(device.platform || "-")}</td>
      <td>${escapeHtml(device.deviceId || "-")}</td>
      <td><span class="pill ${device.active ? "on" : "off"}">${device.active ? "ON" : "OFF"}</span></td>
      <td>${escapeHtml(formatDateTime(device.lastSeenAt || device.updatedAt))}</td>
      <td>
        <button class="secondary" data-device-id="${escapeHtml(device.id)}" data-next-active="${device.active ? "0" : "1"}">
          ${device.active ? "끄기" : "켜기"}
        </button>
      </td>
    </tr>
  `).join("");

  tbody.querySelectorAll("button[data-device-id]").forEach((button) => {
    button.addEventListener("click", async () => {
      try {
        const tokenId = button.dataset.deviceId;
        const enable = button.dataset.nextActive === "1";
        await requestData(`/api/notifications/devices/${encodeURIComponent(tokenId)}/${enable ? "unmute" : "mute"}`, {
          method: "PATCH"
        });
        setStatus(`기기 알림 ${enable ? "켜기" : "끄기"} 완료`, "good");
        await loadDevices();
      } catch (error) {
        setStatus(error.message || String(error), "bad");
      }
    });
  });
}

async function loadDevices() {
  const data = await requestData("/api/notifications/devices");
  renderDevices(data);
}

function setAllNotificationTypes(enabled) {
  notificationSettings = notificationSettings.map((item) => ({ ...item, enabled }));
  renderNotificationTypes();
}

async function refreshAll() {
  ensureSession();
  await refreshNotificationBell("notificationBellMount");
  await Promise.all([
    loadProfile(),
    loadAvailability(),
    loadNotificationSettings(),
    loadDevices()
  ]);
}

el("saveProfileButton").addEventListener("click", async () => {
  try {
    await saveProfile();
    setStatus("프로필 저장 완료", "good");
  } catch (error) {
    setStatus(error.message || String(error), "bad");
  }
});

el("editProfileButton").addEventListener("click", () => {
  setProfileEditMode(true);
  setStatus("프로필 수정 모드", "");
});

el("cancelProfileEditButton").addEventListener("click", () => {
  setProfileFields(lastProfileData || {});
  renderProfileSummary();
  setProfileEditMode(false);
  setStatus("프로필 수정을 취소했습니다.", "");
});

el("profileImageFileInput").addEventListener("change", () => renderProfileSummary());
el("nicknameInput").addEventListener("input", () => renderProfileSummary());
el("phoneInput").addEventListener("input", () => renderProfileSummary());
el("regionInput").addEventListener("input", () => renderProfileSummary());

el("saveAvailabilityButton").addEventListener("click", async () => {
  try {
    await saveAvailability();
    setStatus("상태 저장 완료", "good");
  } catch (error) {
    setStatus(error.message || String(error), "bad");
  }
});

el("enableAllNotificationTypesButton").addEventListener("click", () => setAllNotificationTypes(true));
el("disableAllNotificationTypesButton").addEventListener("click", () => setAllNotificationTypes(false));
el("saveNotificationSettingsButton").addEventListener("click", async () => {
  try {
    await saveNotificationSettings();
    setStatus("알림 설정 저장 완료", "good");
  } catch (error) {
    setStatus(error.message || String(error), "bad");
  }
});

mountNotificationBell("notificationBellMount");
refreshAll()
  .then(() => setStatus("설정 준비 완료", "good"))
  .catch((error) => setStatus(error.message || String(error), "bad"));
</script>
</body>
</html>
