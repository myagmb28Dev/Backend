<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/js/page-embed-guard.js"></script>
  <title>Pogun Missing Notice Console</title>
  <style>
    :root { --bg:#0f0b14; --card:#171220; --surface:#1f1930; --ink:#f5f3ff; --muted:#a59bb9; --line:#2d2540; --accent:#8b5cf6; --good:#34d399; --bad:#f87171; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); }
    main { width:min(980px,calc(100% - 28px)); margin:20px auto 32px; display:grid; gap:14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; box-shadow:none; }
    h1,h2,h3,p { margin:0; }
    .page-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .status { min-height:40px; padding:10px 12px; border-radius:8px; background:var(--surface); border:1px solid var(--line); color:var(--muted); font-size:13px; font-weight:700; }
    .status.good { background:rgba(31,138,76,.12); color:var(--good); }
    .status.bad { background:rgba(180,35,24,.10); color:var(--bad); }
    .account-strip { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
    .account-toggle { width:auto; min-width:72px; padding:8px 12px; border:1px solid #33363b; border-radius:999px; background:var(--surface); color:var(--ink); font-size:12px; font-weight:900; cursor:pointer; }
    .account-toggle.active { border-color:#4f5663; background:#2a2e36; box-shadow:0 0 0 3px rgba(80,86,98,.25); }
    .muted { color:var(--muted); font-size:12px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .grid .full { grid-column:1 / -1; }
    label { display:grid; gap:6px; font-size:12px; font-weight:700; color:var(--muted); }
    input,select,textarea { width:100%; border:1px solid var(--line); border-radius:8px; background:#130f1d; color:var(--ink); padding:10px; font:inherit; }
    textarea { min-height:84px; resize:vertical; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    button { border:1px solid #6d46c6; border-radius:8px; padding:10px 12px; font-weight:700; cursor:pointer; color:#fff; background:var(--accent); }
    button.secondary { background:#1f1930; color:var(--ink); border:1px solid var(--line); }
    .page-head .muted { display:none; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .detail { display:grid; gap:8px; }
    .notice-list-controls { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin-top:10px; }
    .notice-list { display:grid; gap:8px; margin-top:10px; }
    .notice-item { border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:10px; display:grid; gap:6px; }
    .notice-item .top { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .notice-item .meta { font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
    .detail-images { display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:8px; }
    .detail-images img { width:100%; border-radius:10px; border:1px solid #31343a; display:block; background:#202226; }
    .search-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:end; margin-top:10px; }
    @media (max-width:760px){ .grid{grid-template-columns:1fr;} }
    @media (max-width:640px){
      html,body{width:100%;max-width:100%;overflow-x:hidden;}
      main{width:100%;max-width:100%;margin:0;padding:10px;gap:10px;}
      .card{width:100%;min-width:0;border-radius:12px;padding:14px;box-shadow:0 10px 24px rgba(0,0,0,.28);}
      .page-head{display:grid;gap:10px;}
      h1{font-size:22px;line-height:1.25;overflow-wrap:anywhere;}
      h2{font-size:18px;line-height:1.25;}
      h3{font-size:16px;line-height:1.3;}
      .status{min-width:0;border-radius:10px;overflow-wrap:anywhere;}
      .grid{grid-template-columns:1fr;gap:9px;}
      label{font-size:12px;line-height:1.35;}
      input,select,textarea{min-width:0;border-radius:10px;font-size:13px;padding:10px;}
      textarea{min-height:76px;}
      .actions{display:grid;grid-template-columns:1fr;gap:7px;}
      button{width:100%;min-height:42px;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.25;white-space:normal;}
      .search-row{grid-template-columns:1fr;}
      .muted{font-size:12px;line-height:1.45;overflow-wrap:anywhere;}
      .detail{min-width:0;overflow-wrap:anywhere;}
      .notice-list-controls{grid-template-columns:1fr;gap:7px;}
      .detail-images{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;}
      .detail-images img{border-radius:8px;}
    }
    @media (max-width:380px){
      main{padding:8px;}
      .card{padding:12px;}
      h1{font-size:20px;}
      .detail-images{grid-template-columns:1fr;}
    }
  </style>
  <link rel="stylesheet" href="/full_compact/admin-theme.css">
</head>
<body>
<main>
  <section class="card">
    <div class="page-head">
      <div>
        <h1>실종 공고 관리</h1>
        <p class="muted" style="margin-top:6px">실종 공고를 조회하고, 새 공고를 등록하거나 기존 공고를 정리합니다.</p>
      </div>
      <div id="notificationBellMount"></div>
    </div>
    <div id="status" class="status" style="margin-top:10px">준비 중</div>
  </section>

  <section class="card">
    <h2>세션 상태</h2>
    <div id="accountHint" class="muted">로그인 탭에서 인증 후 이용하세요.</div>
  </section>

  <section class="workspace">
    <section class="card">
      <h2>목록 및 필터</h2>
      <p class="section-note">공개 상태와 키워드 기준으로 공고를 좁히고, 현재 작업할 공고를 선택합니다.</p>
      <div class="search-row">
        <label>검색<input id="listQuery" placeholder="제목/설명 검색"></label>
        <button id="searchNoticeButton" class="secondary" disabled>검색</button>
      </div>
      <div class="notice-list-controls">
        <label>상태
          <select id="listStatus">
            <option value="">전체</option>
            <option value="OPEN">OPEN</option>
            <option value="RESOLVED">RESOLVED</option>
            <option value="CLOSED">CLOSED</option>
          </select>
        </label>
        <label>내 공고만
          <select id="listMineOnly">
            <option value="false" selected>전체</option>
            <option value="true">내 공고만</option>
          </select>
        </label>
        <label>조회 범위
          <select id="listRegionScope">
            <option value="my-region" selected>내 지역 조회</option>
            <option value="all">전체 조회</option>
          </select>
        </label>
        <label>개수
          <select id="listSize">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
          </select>
        </label>
      </div>
      <div class="actions">
        <button id="loadNoticeListButton" class="secondary" disabled>공고 목록 불러오기</button>
        <button id="prevNoticePageButton" class="secondary" disabled>이전 페이지</button>
        <button id="nextNoticePageButton" class="secondary" disabled>다음 페이지</button>
      </div>
      <div id="noticePageInfo" class="muted" style="margin-top:8px">페이지 정보 없음</div>
      <div id="noticeList" class="notice-list muted">로그인 후 목록을 조회할 수 있습니다.</div>
    </section>

    <div class="stack">
      <section class="card">
        <h2>공고 편집</h2>
        <div id="editorMode" class="muted" style="margin-top:8px">새 공고 작성 모드</div>
        <div class="grid" style="margin-top:10px">
          <label>제목*<input id="title" placeholder="말티즈를 찾습니다"></label>
          <label>동물 종류*<input id="animalType" value="DOG" placeholder="DOG"></label>
          <label>품종<input id="breed" placeholder="말티즈"></label>
          <label>성별
            <select id="gender">
              <option value="">선택 안 함</option>
              <option value="MALE">MALE</option>
              <option value="FEMALE">FEMALE</option>
              <option value="UNKNOWN">UNKNOWN</option>
            </select>
          </label>
          <label>나이<input id="age" type="number" min="0" placeholder="3"></label>
          <label>색상<input id="color" placeholder="WHITE"></label>
          <label class="full">설명<textarea id="description" placeholder="특징, 목줄 여부 등"></textarea></label>
          <label>실종 시각(UTC ISO)*<input id="missingDate" placeholder="2026-03-18T10:00:00Z"></label>
          <label>실종 지역*<input id="missingRegion" placeholder="서울 강남구"></label>
          <label class="full">실종 상세 주소<input id="missingAddress" placeholder="역삼역 인근"></label>
          <label>사례금<input id="rewardAmount" type="number" min="0" placeholder="300000"></label>
          <label>연락처<input id="contactPhone" placeholder="010-1111-2222"></label>
          <label>상태
            <select id="statusField">
              <option value="OPEN" selected>OPEN</option>
              <option value="RESOLVED">RESOLVED</option>
              <option value="CLOSED">CLOSED</option>
            </select>
          </label>
          <label class="full">이미지<input id="images" type="file" accept=".png,.jpg,.jpeg,.gif,image/png,image/jpeg,image/gif" multiple></label>
        </div>
        <div class="actions">
          <button id="createNoticeButton" disabled>공고 생성</button>
          <button id="saveEditButton" class="secondary" disabled style="display:none">수정 저장</button>
          <button id="cancelEditButton" class="secondary" disabled style="display:none">수정 취소</button>
          <button id="deleteNoticeButton" class="secondary" disabled style="display:none">공고 삭제</button>
          <button id="loadDetailButton" class="secondary" disabled>선택 공고 새로고침</button>
        </div>
      </section>

      <section class="card">
        <h2>선택 공고 상세</h2>
        <div id="detail" class="detail muted" style="margin-top:10px">공고를 선택하면 여기서 상세를 확인할 수 있습니다.</div>
      </section>
    </div>
  </section>
</main>

<script type="module">
import { request } from "/js/api-client.js";
import { loadSession as loadStoredSession, removeSession, saveSession as saveStoredSession } from "/js/session-store.js";
import { refreshFirebaseSession } from "/js/auth-refresh.js";

const BACKEND_BASE = window.location.origin;
const ACTIVE_ROLE_KEY = "dm-test-active-role-v1";
const REAL_SESSION_KEY = "pogun-real-firebase-session-v1";
const REAL_ROLE = "google";
const query = new URLSearchParams(window.location.search);
let currentNoticeId = (query.get("noticeId") || "").trim() || null;
let activeRole = null;
let currentNotice = null;
let editingNoticeId = null;
let noticeListPage = 0;
let noticeListTotalPages = 0;
let noticeListTotalElements = 0;

const users = { [REAL_ROLE]: { label: "Google 사용자", email: "", token: null, userId: null } };

const el = (id) => document.getElementById(id);
function setStatus(message, tone = "") { const node = el("status"); node.textContent = message; node.className = `status${tone ? ` ${tone}` : ""}`; }
function escapeHtml(value) { return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;"); }

function renderSessionInfo() {
  const user = activeRole ? users[activeRole] : null;
  el("accountHint").textContent = user
    ? `${user.label} 로그인됨 · ${user.email}${user.userId ? ` · ${user.userId}` : ""}`
    : "로그인 세션이 연결되지 않았습니다. 로그인 탭에서 다시 인증하세요.";
  el("createNoticeButton").disabled = !activeRole;
  el("loadNoticeListButton").disabled = !activeRole;
  el("searchNoticeButton").disabled = !activeRole;
  renderNoticePagination();
  el("loadDetailButton").disabled = !activeRole || !currentNoticeId;
  syncEditorButtons();
}

function renderNoticePagination() {
  const hasSession = Boolean(activeRole);
  const hasPages = noticeListTotalPages > 0;
  el("prevNoticePageButton").disabled = !hasSession || !hasPages || noticeListPage <= 0;
  el("nextNoticePageButton").disabled = !hasSession || !hasPages || noticeListPage >= noticeListTotalPages - 1;
  el("noticePageInfo").textContent = hasPages
    ? `${noticeListPage + 1} / ${noticeListTotalPages} 페이지 · 전체 ${noticeListTotalElements}건`
    : "페이지 정보 없음";
}

function isOwnerNotice(notice = currentNotice) {
  return Boolean(activeRole && notice?.authorId && users[activeRole]?.userId && notice.authorId === users[activeRole].userId);
}

function normalizeSearchScope() {
  if (el("listQuery").value.trim()) {
    el("listRegionScope").value = "all";
    el("listMineOnly").value = "false";
  }
}

function setEditorMode(editing) {
  editingNoticeId = editing ? currentNoticeId : null;
  el("editorMode").textContent = editingNoticeId ? `수정 모드 · ${editingNoticeId}` : "새 공고 작성 모드";
  el("createNoticeButton").style.display = editingNoticeId ? "none" : "";
  el("saveEditButton").style.display = editingNoticeId ? "" : "none";
  el("cancelEditButton").style.display = editingNoticeId ? "" : "none";
  el("deleteNoticeButton").style.display = currentNoticeId && isOwnerNotice() ? "" : "none";
  syncEditorButtons();
}

function syncEditorButtons() {
  const canWrite = Boolean(activeRole);
  const canEdit = Boolean(canWrite && editingNoticeId && currentNoticeId && isOwnerNotice());
  el("createNoticeButton").disabled = !canWrite;
  el("saveEditButton").disabled = !canEdit;
  el("cancelEditButton").disabled = !canEdit;
  el("deleteNoticeButton").disabled = !(canWrite && currentNoticeId && isOwnerNotice());
}

function fillForm(notice) {
  if (!notice) return;
  el("title").value = notice.title || "";
  el("animalType").value = notice.animalType || "";
  el("breed").value = notice.breed || "";
  el("gender").value = notice.gender || "";
  el("age").value = notice.age ?? "";
  el("color").value = notice.color || "";
  el("description").value = notice.description || "";
  el("missingDate").value = notice.missingDate || "";
  el("missingRegion").value = notice.missingRegion || "";
  el("missingAddress").value = notice.missingAddress || "";
  el("rewardAmount").value = notice.rewardAmount ?? "";
  el("contactPhone").value = notice.contactPhone || "";
  el("statusField").value = notice.status || "OPEN";
}

async function authApi(path, init = {}) {
  if (!activeRole || !users[activeRole].token) throw new Error("먼저 로그인하세요.");
  const headers = { Authorization: `Bearer ${users[activeRole].token}`, ...(init.headers || {}) };
  if (!(init.body instanceof FormData) && !headers["Content-Type"]) {
    headers["Content-Type"] = "application/json";
  }
  let response = await request(`${BACKEND_BASE}${path}`, {
    ...init,
    headers
  });
  if (response.status !== 401) {
    return response;
  }
  const refreshedSession = await refreshFirebaseSession(REAL_SESSION_KEY, BACKEND_BASE);
  if (!refreshedSession?.firebaseIdToken) {
    return response;
  }
  users[activeRole].token = refreshedSession.firebaseIdToken;
  const retryHeaders = { ...headers, Authorization: `Bearer ${users[activeRole].token}` };
  response = await request(`${BACKEND_BASE}${path}`, { ...init, headers: retryHeaders });
  return response;
}

function loadRealSession() {
  return loadStoredSession(REAL_SESSION_KEY);
}

function requestLoginRecovery() {
  activeRole = null;
  renderSessionInfo();
  setStatus("세션이 없습니다. 로그인 탭에서 다시 인증하세요.", "bad");
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "pogun-auth-required", view: "notice" }, window.location.origin);
  }
}

async function login(role) {
  role = REAL_ROLE;
  const session = loadRealSession();
  if (!session) {
    requestLoginRecovery();
    return;
  }
  users[role].token = session.firebaseIdToken;
  users[role].email = session.email || "";
  users[role].label = session.nickname || session.email || "Google 사용자";
  setStatus(`${users[role].label} 로그인 중...`);
  let response = await request(`${BACKEND_BASE}/api/auth/login`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ firebaseIdToken: users[role].token })
  });
  if (response.status === 401) {
    const refreshedSession = await refreshFirebaseSession(REAL_SESSION_KEY, BACKEND_BASE);
    if (refreshedSession?.firebaseIdToken) {
      users[role].token = refreshedSession.firebaseIdToken;
      response = await request(`${BACKEND_BASE}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ firebaseIdToken: users[role].token })
      });
    }
  }
  if (response.status !== 200) {
    removeSession(REAL_SESSION_KEY); removeSession(ACTIVE_ROLE_KEY);
    requestLoginRecovery();
    return;
  }
  const data = response.body?.data || {};
  const latestSession = loadStoredSession(REAL_SESSION_KEY) || session;
  users[role].userId = data.id || session.userId || null;
  users[role].email = data.email || users[role].email;
  users[role].label = data.nickname || users[role].label;
  saveStoredSession(REAL_SESSION_KEY, {
    ...latestSession,
    firebaseIdToken: users[role].token,
    firebaseUid: data.firebaseUid || latestSession.firebaseUid || "",
    email: data.email || latestSession.email || "",
    nickname: data.nickname || latestSession.nickname || "",
    profileImageUrl: data.profileImageUrl || latestSession.profileImageUrl || "",
    userId: users[role].userId,
    registrationStatus: data.registrationStatus
  });
  activeRole = role;
  try { window.localStorage.setItem(ACTIVE_ROLE_KEY, role); } catch {}
  renderSessionInfo();
  setStatus(`${users[role].label} 로그인 완료`, "good");
  await loadNoticeList();
  if (currentNoticeId) {
    await loadNoticeDetail(currentNoticeId);
  }
}

function parseOptionalInt(raw) {
  const v = String(raw ?? "").trim();
  if (!v) return null;
  const n = Number(v);
  return Number.isFinite(n) && n >= 0 ? Math.floor(n) : null;
}

function buildCreatePayload() {
  const title = el("title").value.trim();
  const animalType = el("animalType").value.trim();
  const missingDate = el("missingDate").value.trim();
  const missingRegion = el("missingRegion").value.trim();
  if (!title || !animalType || !missingDate || !missingRegion) {
    throw new Error("필수 필드(title, animalType, missingDate, missingRegion)를 입력하세요.");
  }

  return {
    title,
    animalType,
    breed: el("breed").value.trim() || null,
    gender: el("gender").value || null,
    age: parseOptionalInt(el("age").value),
    color: el("color").value.trim() || null,
    description: el("description").value.trim() || null,
    missingDate,
    missingRegion,
    missingAddress: el("missingAddress").value.trim() || null,
    rewardAmount: parseOptionalInt(el("rewardAmount").value),
    contactPhone: el("contactPhone").value.trim() || null,
    status: el("statusField").value || "OPEN"
  };
}

async function createNotice() {
  if (!activeRole) throw new Error("먼저 로그인하세요.");
  const payload = buildCreatePayload();
  const formData = new FormData();
  formData.append("request", new Blob([JSON.stringify(payload)], { type: "application/json" }));
  const files = el("images").files ? [...el("images").files] : [];
  files.forEach((file) => formData.append("images", file));

  setStatus("공고 생성 중...");
  let response = await authApi("/api/missing-pets", { method: "POST", body: formData });
  if (response.status === 401) {
    removeSession(REAL_SESSION_KEY); removeSession(ACTIVE_ROLE_KEY);
    requestLoginRecovery();
    return;
  }
  if (response.status !== 201) throw new Error(`공고 생성 실패: ${JSON.stringify(response.body)}`);

  currentNoticeId = response.body?.data?.id || null;
  el("loadDetailButton").disabled = !activeRole || !currentNoticeId;
  setStatus(`공고 생성 완료: ${response.body?.data?.title || currentNoticeId}`, "good");
  if (currentNoticeId) {
    await loadNoticeDetail(currentNoticeId);
    try {
      await loadNoticeList();
    } catch (listError) {
      console.warn("공지 목록 새로고침 실패", listError);
      setStatus(`공고 생성 완료: ${response.body?.data?.title || currentNoticeId} (목록 새로고침 실패)`, "good");
    }
  }
}

async function updateNotice() {
  if (!activeRole || !editingNoticeId) throw new Error("수정할 공고를 먼저 선택하세요.");
  const payload = buildCreatePayload();
  const formData = new FormData();
  formData.append("request", new Blob([JSON.stringify(payload)], { type: "application/json" }));
  const files = el("images").files ? [...el("images").files] : [];
  files.forEach((file) => formData.append("images", file));

  setStatus("공고 수정 중...");
  const response = await authApi(`/api/missing-pets/${editingNoticeId}`, { method: "PATCH", body: formData });
  if (response.status === 401) {
    removeSession(REAL_SESSION_KEY); removeSession(ACTIVE_ROLE_KEY);
    requestLoginRecovery();
    return;
  }
  if (response.status !== 200) throw new Error(`공고 수정 실패: ${JSON.stringify(response.body)}`);
  currentNoticeId = response.body?.data?.id || editingNoticeId;
  setStatus(`공고 수정 완료: ${response.body?.data?.title || currentNoticeId}`, "good");
  await loadNoticeDetail(currentNoticeId);
  await loadNoticeList();
  setEditorMode(false);
  el("images").value = "";
}

async function deleteNotice() {
  if (!activeRole || !currentNoticeId) throw new Error("삭제할 공고가 없습니다.");
  if (!window.confirm("공고를 삭제하면 연결된 DM 방도 함께 사라집니다. 계속할까요?")) return;
  setStatus("공고 삭제 중...");
  const response = await authApi(`/api/missing-pets/${currentNoticeId}`, { method: "DELETE" });
  if (response.status === 401) {
    removeSession(REAL_SESSION_KEY); removeSession(ACTIVE_ROLE_KEY);
    requestLoginRecovery();
    return;
  }
  if (response.status !== 200) throw new Error(`공고 삭제 실패: ${JSON.stringify(response.body)}`);
  currentNoticeId = null;
  currentNotice = null;
  editingNoticeId = null;
  query.delete("noticeId");
  window.history.replaceState({}, "", `${window.location.pathname}${query.toString() ? `?${query.toString()}` : ""}`);
  el("detail").className = "detail muted";
  el("detail").textContent = "noticeId가 있으면 여기서 상세를 확인할 수 있습니다.";
  setEditorMode(false);
  el("images").value = "";
  setStatus("공고와 연결된 DM 방 삭제 완료", "good");
  await loadNoticeList();
  renderSessionInfo();
}

function startEdit() {
  if (!currentNoticeId || !currentNotice || !isOwnerNotice()) {
    setStatus("작성자만 공고를 수정할 수 있습니다.", "bad");
    return;
  }
  fillForm(currentNotice);
  setEditorMode(true);
  setStatus("공고 수정 모드로 전환", "good");
}

function cancelEdit() {
  if (currentNotice) {
    fillForm(currentNotice);
  }
  el("images").value = "";
  setEditorMode(false);
  setStatus("수정 모드 취소", "good");
}

async function loadAuthenticatedImages() {
  const hasToken = Boolean(activeRole && users[activeRole].token);
  const nodes = [...document.querySelectorAll("img[data-auth-src]")];
  for (const node of nodes) {
    const url = node.getAttribute("data-auth-src");
    if (!url || node.dataset.loaded === "true") continue;
    let resolvedUrl;
    try {
      resolvedUrl = new URL(url, window.location.origin);
    } catch {
      node.remove();
      continue;
    }
    const isCrossOrigin = resolvedUrl.origin !== window.location.origin;

    if (isCrossOrigin) {
      node.src = resolvedUrl.toString();
      node.dataset.loaded = "true";
      continue;
    }

    if (!hasToken) continue;
    const response = await fetch(resolvedUrl.toString(), { headers: { Authorization: `Bearer ${users[activeRole].token}` } });
    if (!response.ok) {
      node.remove();
      continue;
    }
    node.src = URL.createObjectURL(await response.blob());
    node.dataset.loaded = "true";
  }
}

async function loadNoticeDetail(noticeId) {
  if (!activeRole) throw new Error("상세를 보려면 먼저 로그인하세요.");
  const response = await authApi(`/api/missing-pets/${noticeId}`);
  if (response.status !== 200) throw new Error(`공고 상세 조회 실패: ${JSON.stringify(response.body)}`);
  const notice = response.body?.data;
  currentNotice = notice || null;
  const detail = el("detail");
  if (!notice) {
    detail.textContent = "공고 상세 데이터가 없습니다.";
    return;
  }
  detail.className = "detail";
  detail.innerHTML = `
    <div><strong>${escapeHtml(notice.title || "")}</strong></div>
    <div class="muted">ID: ${escapeHtml(notice.id || "")}</div>
    <div class="muted">작성자: ${escapeHtml(notice.authorNickname || "")}</div>
    <div class="muted">동물: ${escapeHtml(notice.animalType || "")} / ${escapeHtml(notice.breed || "-")}</div>
    <div class="muted">성별: ${escapeHtml(notice.gender || "-")} · 나이: ${escapeHtml(notice.age ?? "-")}</div>
    <div class="muted">색상: ${escapeHtml(notice.color || "-")}</div>
    <div class="muted">실종시각: ${escapeHtml(notice.missingDate || "")}</div>
    <div class="muted">실종지역: ${escapeHtml(notice.missingRegion || "")} / ${escapeHtml(notice.missingAddress || "-")}</div>
    <div class="muted">연락처: ${escapeHtml(notice.contactPhone || "-")} · 상태: ${escapeHtml(notice.status || "")}</div>
    <div>${escapeHtml(notice.description || "")}</div>
    <div class="detail-images">${(notice.imageUrls || []).map((url) => `<img data-auth-src="${escapeHtml(url)}" alt="notice image">`).join("")}</div>
    <div class="actions">
      <button id="editCurrentNoticeButton" class="secondary" ${isOwnerNotice(notice) ? "" : "disabled"}>현재 공고 수정</button>
      <button id="deleteCurrentNoticeButton" class="secondary" ${isOwnerNotice(notice) ? "" : "disabled"}>현재 공고 삭제</button>
    </div>
  `;
  detail.querySelector("#editCurrentNoticeButton")?.addEventListener("click", startEdit);
  detail.querySelector("#deleteCurrentNoticeButton")?.addEventListener("click", run(deleteNotice));
  await loadAuthenticatedImages();
  if (editingNoticeId === notice.id) {
    fillForm(notice);
  }
  setEditorMode(Boolean(editingNoticeId && editingNoticeId === notice.id));
  renderSessionInfo();
}

function renderNoticeList(items) {
  const list = el("noticeList");
  if (!items.length) {
    list.className = "notice-list muted";
    list.textContent = "조회된 공고가 없습니다.";
    renderNoticePagination();
    return;
  }
  list.className = "notice-list";
  list.innerHTML = items.map((notice) => {
    const mine = isOwnerNotice(notice);
    return `
      <div class="notice-item">
        <div class="top">
          <strong>${escapeHtml(notice.title || "(제목 없음)")}</strong>
          <button class="secondary" data-notice-open="${escapeHtml(notice.id || "")}">상세 보기</button>
        </div>
        <div class="meta">ID: ${escapeHtml(notice.id || "-")}</div>
        <div class="meta">상태: ${escapeHtml(notice.status || "-")} · 지역: ${escapeHtml(notice.missingRegion || "-")}</div>
        <div class="meta">작성자: ${escapeHtml(notice.authorNickname || "-")}${mine ? " (내 공고)" : ""}</div>
      </div>
    `;
  }).join("");

  list.querySelectorAll("[data-notice-open]").forEach((button) => {
    button.addEventListener("click", run(async () => {
      const noticeId = button.getAttribute("data-notice-open");
      if (!noticeId) return;
      currentNoticeId = noticeId;
      query.set("noticeId", noticeId);
      window.history.replaceState({}, "", `${window.location.pathname}?${query.toString()}`);
      el("loadDetailButton").disabled = false;
      await loadNoticeDetail(noticeId);
    }));
  });
  renderNoticePagination();
}

async function loadNoticeList(page = noticeListPage) {
  if (!activeRole) throw new Error("먼저 로그인하세요.");
  normalizeSearchScope();
  const params = new URLSearchParams();
  const queryText = el("listQuery").value.trim();
  const status = el("listStatus").value;
  const mineOnly = el("listMineOnly").value === "true";
  const regionScope = el("listRegionScope").value;
  const size = String(el("listSize").value || "20");
  noticeListPage = Math.max(Number(page) || 0, 0);
  if (queryText) params.set("query", queryText);
  if (status) params.set("status", status);
  if (mineOnly) params.set("mineOnly", "true");
  if (regionScope === "all") params.set("region", "*");
  params.set("size", size);
  params.set("page", String(noticeListPage));

  setStatus("공고 목록 조회 중...");
  const endpoint = queryText ? "/api/missing-pets/search" : "/api/missing-pets";
  const response = await authApi(`${endpoint}?${params.toString()}`);
  if (response.status !== 200) throw new Error(`공고 목록 조회 실패: ${JSON.stringify(response.body)}`);
  const data = response.body?.data || {};
  noticeListPage = Number(data.filters?.page ?? noticeListPage) || 0;
  noticeListTotalPages = Number(data.totalPages || 0);
  noticeListTotalElements = Number(data.totalElements || 0);
  const rawItems = Array.isArray(data.items) ? data.items : [];
  renderNoticeList(rawItems);
  setStatus(`공고 목록 ${rawItems.length}건 조회 완료`, "good");
}

async function loadNoticeListFromFirstPage() {
  noticeListPage = 0;
  await loadNoticeList(0);
}

function run(handler) {
  return async () => {
    try { await handler(); }
    catch (error) { console.error(error); setStatus(error.message || String(error), "bad"); }
  };
}

el("createNoticeButton").addEventListener("click", run(createNotice));
el("saveEditButton").addEventListener("click", run(updateNotice));
el("cancelEditButton").addEventListener("click", cancelEdit);
el("deleteNoticeButton").addEventListener("click", run(deleteNotice));
el("loadDetailButton").addEventListener("click", run(() => loadNoticeDetail(currentNoticeId)));
el("loadNoticeListButton").addEventListener("click", run(loadNoticeListFromFirstPage));
el("searchNoticeButton").addEventListener("click", run(loadNoticeListFromFirstPage));
el("prevNoticePageButton").addEventListener("click", run(() => loadNoticeList(noticeListPage - 1)));
el("nextNoticePageButton").addEventListener("click", run(() => loadNoticeList(noticeListPage + 1)));
el("listStatus").addEventListener("change", run(loadNoticeListFromFirstPage));
el("listMineOnly").addEventListener("change", run(loadNoticeListFromFirstPage));
el("listRegionScope").addEventListener("change", run(loadNoticeListFromFirstPage));
el("listSize").addEventListener("change", run(loadNoticeListFromFirstPage));

if (!el("missingDate").value) el("missingDate").value = new Date().toISOString();
renderSessionInfo();
setEditorMode(false);
setStatus("세션을 연결하면 실종 공고를 조회하고 편집할 수 있습니다.");

const savedRole = (() => { try { return window.localStorage.getItem(ACTIVE_ROLE_KEY) || ""; } catch { return ""; } })();
const initialRole = savedRole === REAL_ROLE ? REAL_ROLE : (loadRealSession() ? REAL_ROLE : "");
if (initialRole) {
  run(() => login(REAL_ROLE))();
} else {
  requestLoginRecovery();
}
window.addEventListener("storage", (event) => {
  if (event.key !== REAL_SESSION_KEY && event.key !== ACTIVE_ROLE_KEY) {
    return;
  }
  if (loadRealSession()?.firebaseIdToken) {
    run(() => login(REAL_ROLE))();
    return;
  }
  requestLoginRecovery();
});
window.addEventListener("focus", () => {
  if (!activeRole && loadRealSession()?.firebaseIdToken) {
    run(() => login(REAL_ROLE))();
  }
});
</script>

refreshNotificationBell("notificationBellMount").catch(() => {});
window.addEventListener("focus", () => refreshNotificationBell("notificationBellMount").catch(() => {}));
window.addEventListener("notification-web:message", () => refreshNotificationBell("notificationBellMount").catch(() => {}));
</script>
