<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/js/page-embed-guard.js"></script>
  <title>Pogun Community</title>
  <style>
    :root { --bg:#0f0b14; --card:#171220; --surface:#1f1930; --ink:#f5f3ff; --muted:#a59bb9; --line:#2d2540; --accent:#8b5cf6; --good:#34d399; --bad:#f87171; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); }
    main { width:min(980px,calc(100% - 28px)); margin:20px auto 32px; display:grid; gap:14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
    .page-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .status { min-height:40px; padding:10px 12px; border-radius:8px; background:var(--surface); border:1px solid var(--line); color:var(--muted); font-size:13px; font-weight:700; }
    .status.good { background:rgba(31,138,76,.12); color:var(--good); }
    .status.bad { background:rgba(180,35,24,.10); color:var(--bad); }
    .muted { color:var(--muted); font-size:12px; }
    h1,h2,h3,p { margin:0; }
    .grid { display:grid; grid-template-columns:1.1fr .9fr; gap:12px; }
    .stack { display:grid; gap:14px; }
    label { display:grid; gap:6px; font-size:12px; font-weight:700; color:var(--muted); }
    input,select,textarea { width:100%; border:1px solid var(--line); border-radius:8px; background:#130f1d; color:var(--ink); padding:10px; font:inherit; }
    textarea { min-height:84px; resize:vertical; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    button { border:1px solid #6d46c6; border-radius:8px; padding:10px 12px; font-weight:700; cursor:pointer; color:#fff; background:var(--accent); }
    button.secondary { background:#1f1930; border:1px solid var(--line); color:var(--ink); }
    button.danger { border-color:#7f1d1d; background:#3f1515; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .list-controls { display:grid; grid-template-columns:2fr 1fr 1fr; gap:8px; margin-top:10px; }
    .post-list { display:grid; gap:8px; margin-top:10px; max-height:460px; overflow:auto; }
    .post-item { border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:10px; display:grid; gap:6px; cursor:pointer; }
    .post-item:hover { border-color:var(--accent); }
    .post-item.active { border-color:#8b5cf6; box-shadow:0 0 0 1px #8b5cf6 inset; }
    .post-item .top { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .post-meta { font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
    .detail { display:grid; gap:8px; margin-top:10px; }
    .detail-images { display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:8px; }
    .detail-images img { width:100%; border-radius:8px; border:1px solid var(--line); background:#111; }
    .comment-list { display:grid; gap:8px; margin-top:8px; max-height:300px; overflow:auto; }
    .comment-item { border:1px solid var(--line); border-radius:8px; padding:8px; background:#201a31; }
    .comment-item .meta { font-size:11px; color:var(--muted); margin-bottom:4px; }
    .poll-section { border:1px solid var(--line); border-radius:8px; padding:10px; background:#201a31; margin-top:8px; }
    .poll-option { display:flex; align-items:center; gap:8px; padding:6px 0; }
    .poll-option button { padding:6px 12px; font-size:12px; }
    .poll-bar { height:8px; border-radius:4px; background:var(--line); flex:1; overflow:hidden; }
    .poll-bar-fill { height:100%; border-radius:4px; background:var(--accent); transition:width .3s; }
    .reaction-buttons { display:flex; gap:6px; margin:8px 0; flex-wrap:wrap; }
    .reaction-btn { border:1px solid var(--line); border-radius:999px; background:var(--surface); color:var(--ink); padding:6px 12px; font-size:12px; cursor:pointer; }
    .reaction-btn.active { border-color:var(--accent); background:rgba(139,92,246,.15); }
    pre { margin:0; white-space:pre-wrap; word-break:break-word; background:#0f0f11; border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; }
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:1000; justify-content:center; align-items:center; }
    .modal-overlay.show { display:flex; }
    .modal { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; width:min(520px,calc(100% - 32px)); max-height:90vh; overflow-y:auto; }
    @media (max-width:760px){ .grid{grid-template-columns:1fr;} .list-controls{grid-template-columns:1fr;} }
  </style>
  <link rel="stylesheet" href="/full_compact/admin-theme.css">
</head>
<body>
<main>
  <section class="card">
    <div class="page-head">
      <div>
        <h1>커뮤니티</h1>
        <p class="muted" style="margin-top:6px">자유롭게 소통하고 정보를 공유하는 공간입니다.</p>
      </div>
      <div id="notificationBellMount"></div>
    </div>
    <div id="status" class="status" style="margin-top:10px">준비 중</div>
  </section>

  <section class="card">
    <h2>게시글 목록</h2>
    <div class="list-controls">
      <label>검색<input id="qInput" placeholder="제목/내용 검색"></label>
      <label>정렬
        <select id="typeInput">
          <option value="LATEST">최신순</option>
          <option value="POPULAR">인기순</option>
        </select>
      </label>
      <label>카테고리
        <select id="categoryInput">
          <option value="">전체</option>
          <option value="FREE">자유</option>
          <option value="QUESTION">질문</option>
          <option value="TIP">팁</option>
          <option value="REVIEW">후기</option>
          <option value="NOTICE">공지</option>
        </select>
      </label>
    </div>
    <div class="actions">
      <button id="loadListButton" class="secondary">조회</button>
      <button id="prevPageButton" class="secondary">← 이전</button>
      <button id="nextPageButton" class="secondary">다음 →</button>
      <button id="showCreateButton">글쓰기</button>
    </div>
    <div id="pageInfo" class="muted" style="margin-top:8px">-</div>
    <div id="postList" class="post-list muted">로그인 후 게시글을 볼 수 있습니다.</div>
  </section>

  <section class="card">
    <h2>게시글 상세</h2>
    <div id="detail" class="detail muted">게시글을 선택하면 여기서 내용을 확인할 수 있습니다.</div>
  </section>
</main>

<div id="createModal" class="modal-overlay">
  <div class="modal">
    <h2>새 게시글 작성</h2>
    <label>제목<input id="createTitle" placeholder="제목을 입력하세요"></label>
    <label>내용<textarea id="createContent" placeholder="내용을 입력하세요"></textarea></label>
    <label>카테고리
      <select id="createCategory">
        <option value="FREE">자유</option>
        <option value="QUESTION">질문</option>
        <option value="TIP">팁</option>
        <option value="REVIEW">후기</option>
        <option value="NOTICE">공지</option>
      </select>
    </label>
    <label>태그 (쉼표 구분)<input id="createTags" placeholder="tag1,tag2"></label>
    <label>투표 질문 (선택)<input id="createPollQuestion" placeholder="투표 질문"></label>
    <label>투표 옵션 (쉼표 구분)<input id="createPollOptions" placeholder="option1,option2,option3"></label>
    <label>이미지<input id="createImages" type="file" multiple accept="image/*"></label>
    <div class="actions">
      <button id="createSubmitButton">등록</button>
      <button id="createCancelButton" class="secondary">취소</button>
    </div>
  </div>
</div>

<script type="module" src="/js/global-presence.js"></script>
<script type="module" src="/js/pages/community-flow.js"></script>
<script type="module">
import { mountNotificationBell, refreshNotificationBell } from "/js/notification-web.js";
mountNotificationBell("notificationBellMount");
refreshNotificationBell("notificationBellMount").catch(() => {});
window.addEventListener("focus", () => refreshNotificationBell("notificationBellMount").catch(() => {}));
window.addEventListener("notification-web:message", () => refreshNotificationBell("notificationBellMount").catch(() => {}));
</script>
</body>
</html>
