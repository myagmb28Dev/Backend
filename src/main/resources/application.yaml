spring:
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 31MB
      max-request-size: 31MB
  config:
    import:
      - optional:file:.env[.properties]
  application:
    name: demo
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    generate-ddl: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${JPA_SHOW_SQL:false}

app:
  upload:
    root: uploads
  kakao:
    local:
      rest-api-key: ${KAKAO_REST_API_KEY:}
      javascript-key: ${KAKAO_JAVASCRIPT_KEY:}
      base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
  firebase:
    auth:
      mode: PRODUCTION
      project-id: ${FIREBASE_PROJECT_ID:${GCLOUD_PROJECT:}}
      emulator-host:
      allow-emulator: false
  shelter:
    api:
      base-url: ${SHELTER_API_BASE_URL:https://apis.data.go.kr/1543061/abandonmentPublicService_v2}
      service-key: ${SHELTER_API_SERVICE_KEY:}
      abandonment-path: ${SHELTER_API_ABANDONMENT_PATH:/abandonmentPublic_v2}
      sido-path: ${SHELTER_API_SIDO_PATH:/sido_v2}
      sigungu-path: ${SHELTER_API_SIGUNGU_PATH:/sigungu_v2}
      shelter-path: ${SHELTER_API_SHELTER_PATH:/shelter_v2}
      kind-path: ${SHELTER_API_KIND_PATH:/kind_v2}

decorator:
  datasource:
    p6spy:
      enable-logging: ${P6SPY_ENABLE_LOGGING:false}

springdoc:
  swagger-ui:
    url: /v3/api-docs
    custom-css-path: /swagger-ui/dark.css

server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
