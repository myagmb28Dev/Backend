spring:
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  config:
    import:
      - optional:file:.env[.properties]
  application:
    name: demo


  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    generate-ddl: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${JPA_SHOW_SQL:false}

app:
  upload:
    root: uploads
  firebase:
    auth:
      mode: ${APP_FIREBASE_AUTH_MODE:PRODUCTION}
      project-id: ${FIREBASE_PROJECT_ID:${GCLOUD_PROJECT:}}
      emulator-host: ${FIREBASE_AUTH_EMULATOR_HOST:}
      allow-emulator: ${FIREBASE_ALLOW_AUTH_EMULATOR:false}

decorator:
  datasource:
    p6spy:
      enable-logging: ${P6SPY_ENABLE_LOGGING:false}

  # ----------------------------------

springdoc:
  swagger-ui:
    url: /v3/api-docs
    custom-css-path: /swagger-ui/dark.css

server:
  port: ${PORT:8080}
